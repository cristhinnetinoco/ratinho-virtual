<!doctype html>
<html lang="pt-BR">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tem um rato">
<meta name="theme-color" content="#1b1233">

<title>Tem um rato aqui</title>

<style>
:root{
  --ground:#1b1233;
  --ink:#3a2a4a;
  --panel:#fff8e6;
  --panel-edge:#3a2a4a;
  --focus:#3fb7a0;
  --sw:375px; /* largura do palco em px, definida pelo JS */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  background:var(--ground);
  color:#fffaf0;
  font-family:"VT323","Courier New",monospace;
  overflow:hidden;
  touch-action:none;
  -webkit-user-select:none;user-select:none;
  overscroll-behavior:none;
}
.stage{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  background:#f6ecd2;overflow:hidden;
}
.stage canvas{
  display:block;position:absolute;left:0;top:0;
  image-rendering:pixelated;image-rendering:crisp-edges;
  touch-action:none;
}
#ui{position:absolute;inset:0;pointer-events:none;font-size:calc(var(--sw) * .048);line-height:1.15}
#ui > *{pointer-events:auto}

/* ---------- barra de cima e navegacao entre comodos ---------- */
.topbar{
  position:absolute;left:0;right:0;top:0;padding:1.5% 3%;
  display:flex;justify-content:space-between;align-items:center;
  font-family:"Press Start 2P",monospace;font-size:.5em;color:#fffaf0;
  text-shadow:1px 1px 0 #1b1233;
  pointer-events:none !important;
}
.topbar .coins{display:flex;align-items:center;gap:4px}
.topbar .lvl{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.85em}
.topbar .lvl i{display:block;width:4.5em;height:.45em;border:1px solid #fffaf0;background:#1b1233}
.topbar .lvl b{display:block;height:100%;background:#3fb7a0}
.opt .star{width:.7em;height:.7em;margin-left:4px;image-rendering:pixelated;vertical-align:middle}
.medals{display:flex;flex-wrap:wrap;gap:4px}
.medal{font-size:.72em;border:2px solid #3a2a4a;padding:1px 5px;background:#e9dfc9;color:#6b5a86;opacity:.6}
.medal.on{background:#ffd23f;color:#3a2a4a;opacity:1}
.sellmode{appearance:none;border:2px solid #3a2a4a;background:#e9dfc9;color:#3a2a4a;font-family:"Press Start 2P",monospace;font-size:.34em;padding:3px 6px;cursor:pointer}
.sellmode.on{background:#e05a4e;color:#fffaf0}
label.opt{cursor:pointer}
.topbar .coins img{width:1.8em;height:1.8em;image-rendering:pixelated}
.nav{
  position:absolute;top:44%;width:2em;height:3em;
  appearance:none;border:2px solid #3a2a4a;background:rgba(255,250,240,.85);color:#3a2a4a;
  font-family:"Press Start 2P",monospace;font-size:.6em;cursor:pointer;
  box-shadow:2px 2px 0 #3a2a4a;touch-action:manipulation;padding:0;
}
.nav.l{left:2%}.nav.r{right:2%}
.nav:active{background:#ffd23f}

/* ---------- paineis ---------- */
.panel{
  position:absolute;left:4%;right:4%;top:9%;bottom:12%;
  background:var(--panel);
  border:2px solid var(--panel-edge);
  box-shadow:3px 3px 0 var(--panel-edge);
  padding:3% 4%;
  display:flex;flex-direction:column;gap:2.5%;
  color:#3a2a4a;
  overflow:hidden;
}
.panel.short{top:auto;bottom:12%;height:38%}
.panel h2{
  margin:0;font-family:"Press Start 2P",monospace;font-size:.5em;line-height:1.4;letter-spacing:.02em;
  color:#3a2a4a;text-transform:uppercase;
}
.panel .sub{font-size:.85em;color:#6b5a86;margin:0}
.panel p{margin:0}
.list{display:flex;flex-direction:column;gap:2%;overflow-y:auto;flex:1;min-height:0;padding-right:2px}
.list h3{
  margin:2% 0 0;font-family:"Press Start 2P",monospace;font-size:.38em;color:#6b5a86;letter-spacing:.1em;
}
.opt{
  appearance:none;border:2px solid #3a2a4a;background:#fffaf0;
  font:inherit;color:#3a2a4a;text-align:left;
  padding:1.5% 3%;display:flex;align-items:center;gap:6px;
  cursor:pointer;line-height:1.1;min-height:1.7em;flex:0 0 auto;
}
.opt .ico{width:1.5em;height:1.5em;flex:0 0 auto;image-rendering:pixelated;object-fit:contain}
.opt .name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt .meta{font-size:.85em;color:#6b5a86;white-space:nowrap}
.opt.focus,.opt:focus-visible{outline:none;background:#ffd23f;box-shadow:2px 2px 0 #3a2a4a}
.opt.owned{background:#e4f4ee}
.opt.disabled{opacity:.45}
.opt.danger{border-color:#e05a4e;color:#a63b33}
.opt.center{justify-content:center}
.tabs{display:flex;gap:2%}
.tab{
  flex:1;appearance:none;border:2px solid #3a2a4a;background:#e9dfc9;color:#3a2a4a;
  font-family:"Press Start 2P",monospace;font-size:.36em;padding:4% 0;cursor:pointer;
}
.tab.on{background:#3fb7a0;color:#fffaf0}
.coins{font-family:"Press Start 2P",monospace;font-size:.42em;display:flex;align-items:center;gap:4px;color:#3a2a4a}
.coins img{width:1.6em;height:1.6em;image-rendering:pixelated}
.bars{display:flex;flex-direction:column;gap:3%}
.bar{display:grid;grid-template-columns:1.4em 1fr 2.4em;align-items:center;gap:6px}
.bar img{width:1.3em;height:1.3em;image-rendering:pixelated}
.bar .track{height:.7em;border:2px solid #3a2a4a;background:#fffaf0;position:relative;overflow:hidden}
.bar .fill{position:absolute;top:0;bottom:0;left:0;background:#3fb7a0}
.bar .fill.low{background:#e05a4e}
.bar .fill.mid{background:#ffd23f}
.bar .val{font-family:"Press Start 2P",monospace;font-size:.4em;text-align:right;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:.92em}
.kv b{font-weight:normal;color:#6b5a86}
.toast{
  position:absolute;left:5%;right:5%;top:8%;
  background:#fffaf0;border:2px solid #3a2a4a;box-shadow:2px 2px 0 #3a2a4a;
  padding:1.5% 4%;font-size:.95em;color:#3a2a4a;text-align:center;
  animation:pop .18s ease-out;pointer-events:none !important;
}
.toast::after{
  content:"";position:absolute;left:50%;bottom:-8px;width:8px;height:8px;
  background:#fffaf0;border-right:2px solid #3a2a4a;border-bottom:2px solid #3a2a4a;
  transform:translateX(-50%) rotate(45deg);
}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.quit{
  position:absolute;top:1.5%;right:2%;width:1.4em;height:1.4em;
  appearance:none;border:2px solid #3a2a4a;background:#fffaf0;color:#3a2a4a;
  font-family:"Press Start 2P",monospace;font-size:.5em;line-height:1;cursor:pointer;
  box-shadow:2px 2px 0 #3a2a4a;touch-action:manipulation;
}
.hud{
  position:absolute;left:0;right:0;top:0;padding:1.5% 12% 1.5% 3%;
  display:flex;justify-content:space-between;
  font-family:"Press Start 2P",monospace;font-size:.42em;color:#3a2a4a;
  text-shadow:1px 1px 0 #fffaf0,-1px -1px 0 #fffaf0,1px -1px 0 #fffaf0,-1px 1px 0 #fffaf0;
  pointer-events:none !important;
}
.hud.dark{color:#fffaf0;text-shadow:1px 1px 0 #3a2a4a,-1px -1px 0 #3a2a4a,1px -1px 0 #3a2a4a,-1px 1px 0 #3a2a4a}
.timer{
  position:absolute;left:50%;top:5.5%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:3px;
  pointer-events:none !important;
}
.timer .num{
  font-family:"Press Start 2P",monospace;font-size:1.1em;color:#3a2a4a;
  text-shadow:2px 2px 0 #fffaf0,-2px -2px 0 #fffaf0,2px -2px 0 #fffaf0,-2px 2px 0 #fffaf0,0 2px 0 #fffaf0,0 -2px 0 #fffaf0,2px 0 0 #fffaf0,-2px 0 0 #fffaf0;
  font-variant-numeric:tabular-nums;
}
.timer .track{width:4.5em;height:.35em;border:2px solid #3a2a4a;background:#fffaf0;overflow:hidden}
.timer .fill{height:100%;background:#3fb7a0}
.timer.low .num{color:#e05a4e;animation:pulse .5s steps(2,start) infinite}
.timer.low .fill{background:#e05a4e}
@keyframes pulse{to{opacity:.35}}
.hint{
  position:absolute;left:0;right:0;bottom:3%;text-align:center;
  font-family:"Press Start 2P",monospace;font-size:.38em;color:#3a2a4a;
  text-shadow:1px 1px 0 #fffaf0,-1px -1px 0 #fffaf0,1px -1px 0 #fffaf0,-1px 1px 0 #fffaf0;
  pointer-events:none !important;
}
.hint.dark{color:#fffaf0;text-shadow:1px 1px 0 #3a2a4a,-1px -1px 0 #3a2a4a,1px -1px 0 #3a2a4a,-1px 1px 0 #3a2a4a}
.dpad{
  position:absolute;left:0;right:0;bottom:0;height:22%;
  display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr;
  gap:2px;padding:1%;
  background:rgba(58,42,74,.85);
}
.dpad button{
  appearance:none;border:2px solid #fffaf0;background:#6b5a86;color:#fffaf0;
  font-family:"Press Start 2P",monospace;font-size:.5em;cursor:pointer;border-radius:3px;
  touch-action:manipulation;
}
.dpad button:active{background:#3fb7a0}
.dpad .u{grid-column:2;grid-row:1}
.dpad .l{grid-column:1;grid-row:2}
.dpad .d{grid-column:2;grid-row:2}
.dpad .r{grid-column:3;grid-row:2}
.big{font-family:"Press Start 2P",monospace;font-size:.7em;line-height:1.5}
.title{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:12% 8% 30%;color:#3a2a4a;
}
.title .logo{
  font-family:"Press Start 2P",monospace;font-size:.8em;line-height:1.5;text-align:center;
  color:#3a2a4a;text-shadow:3px 3px 0 #ffd23f;
}
.title .logo small{display:block;font-size:.5em;color:#6b5a86;text-shadow:none;letter-spacing:.2em;margin-top:6%}
.blink{animation:blink 1.1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
input.name{
  font:inherit;font-size:1.05em;border:2px solid #3a2a4a;background:#fffaf0;color:#3a2a4a;
  padding:2% 4%;width:100%;text-align:center;
}
input.name:focus{outline:2px solid #3fb7a0}
textarea.code{
  font-family:"Courier New",monospace;font-size:.6em;border:2px solid #3a2a4a;background:#fffaf0;color:#3a2a4a;
  width:100%;height:5em;resize:none;padding:3px;
}
.row{display:flex;gap:3%}
.row .opt{flex:1;justify-content:center}
@media (prefers-reduced-motion: reduce){
  .toast{animation:none}.blink{animation:none}
}

</style>
</head>

/* ===== Helpers de desenho ===== */
const _sprCache = new Map();
function spriteCanvas(name, remap){
  const key = name + '|' + (remap ? JSON.stringify(remap) : '');
  if (_sprCache.has(key)) return _sprCache.get(key);
  const rows = SPR[name];
  if (!rows){ console.warn('sprite?', name); return null; }
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  for (let y = 0; y < h; y++){
    const row = rows[y];
    if (row.length !== w) console.warn('sprite linha irregular:', name, y, row.length, w);
    for (let x = 0; x < row.length; x++){
      const ch = row[x];
      if (ch === '.' || ch === ' ') continue;
      const col = (remap && remap[ch]) || PAL[ch];
      if (!col) continue;
      g.fillStyle = col; g.fillRect(x, y, 1, 1);
    }
  }
  _sprCache.set(key, c);
  return c;
}
function drawSpr(ctx, name, x, y, o){
  const c = spriteCanvas(name, o && o.remap);
  if (!c) return;
  x = Math.round(x); y = Math.round(y);
  if (o && o.flip){
    ctx.save(); ctx.translate(x + c.width, y); ctx.scale(-1, 1); ctx.drawImage(c, 0, 0); ctx.restore();
  } else if (o && o.alpha != null){
    ctx.save(); ctx.globalAlpha = o.alpha; ctx.drawImage(c, x, y); ctx.restore();
  } else {
    ctx.drawImage(c, x, y);
  }
}
const _urlCache = new Map();
function sprURL(name, remap){
  const key = name + '|' + (remap ? JSON.stringify(remap) : '');
  if (_urlCache.has(key)) return _urlCache.get(key);
  const c = spriteCanvas(name, remap);
  const u = c ? c.toDataURL() : '';
  _urlCache.set(key, u);
  return u;
}
function sprImg(name, remap){ return '<img class="ico" alt="" src="' + sprURL(name, remap) + '">'; }

function px(ctx, x, y, color){ ctx.fillStyle = color; ctx.fillRect(Math.round(x), Math.round(y), 1, 1); }
function rect(ctx, x, y, w, h, color){ ctx.fillStyle = color; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function box(ctx, x, y, w, h, fill, outline){
  rect(ctx, x, y, w, h, outline);
  rect(ctx, x + 1, y + 1, w - 2, h - 2, fill);
}
function fillEllipse(ctx, cx, cy, rx, ry, color){
  ctx.fillStyle = color;
  cx = Math.round(cx); cy = Math.round(cy);
  const RY = Math.max(0, Math.round(ry));
  for (let dy = -RY; dy <= RY; dy++){
    const t = dy / (ry + 0.5);
    const hw = rx * Math.sqrt(Math.max(0, 1 - t * t));
    const x0 = Math.round(cx - hw), x1 = Math.round(cx + hw);
    ctx.fillRect(x0, cy + dy, x1 - x0 + 1, 1);
  }
}
function oEllipse(ctx, cx, cy, rx, ry, fill, outline){
  fillEllipse(ctx, cx, cy, rx + 1, ry + 1, outline || PAL.k);
  fillEllipse(ctx, cx, cy, rx, ry, fill);
}
function curve(ctx, p0, p1, p2, color, thick){
  ctx.fillStyle = color;
  const n = 24, t0 = thick || 1, off = Math.floor(t0 / 2);
  for (let i = 0; i <= n; i++){
    const t = i / n, u = 1 - t;
    const x = u * u * p0[0] + 2 * u * t * p1[0] + t * t * p2[0];
    const y = u * u * p0[1] + 2 * u * t * p1[1] + t * t * p2[1];
    ctx.fillRect(Math.round(x) - off, Math.round(y) - off, t0, t0);
  }
}
function circleFill(ctx, cx, cy, r, color){ fillEllipse(ctx, cx, cy, r, r, color); }

const PRINTS = {
  coracao:['.h.h.', 'hhhhh', 'hhhhh', '.hhh.', '..h..'],
  estrela:['..y..', '.yyy.', 'yyyyy', '.yyy.', '..y..'],
  queijo: ['....k', '..kyk', 'kkyyk', 'kyYyk', 'kkkkk'],
  nota:   ['...w.', '...w.', '...w.', '.www.', '.ww..']
};

function ratTop(stage, y){
  return stage === 'baby' ? y - 20 : stage === 'young' ? y - 27 : y - 34;
}

function drawFace(ctx, cx, ey, stage, face, t, blushCol){
  const K = PAL.k, W = PAL.w;
  const eh = stage === 'baby' ? 2 : 3;
  const lx = cx - 4, rx = cx + 3;
  const ny = ey + eh, my = ey + eh + 1;
  const eyesNormal = () => {
    rect(ctx, lx, ey, 2, eh, K); rect(ctx, rx, ey, 2, eh, K);
    px(ctx, lx, ey, W); px(ctx, rx, ey, W);
  };
  const mouthW = () => {
    if (stage === 'baby'){ px(ctx, cx - 1, my, K); px(ctx, cx, my + 1, K); px(ctx, cx + 1, my, K); }
    else { px(ctx, cx - 2, my, K); px(ctx, cx - 1, my + 1, K); px(ctx, cx, my, K); px(ctx, cx + 1, my + 1, K); px(ctx, cx + 2, my, K); }
  };
  const blush = () => { rect(ctx, cx - 7, ny, 2, 1, blushCol); rect(ctx, cx + 6, ny, 2, 1, blushCol); };
  switch (face){
    case 'blink':
      rect(ctx, lx, ey + eh - 1, 2, 1, K); rect(ctx, rx, ey + eh - 1, 2, 1, K); mouthW(); break;
    case 'happy':
    case 'pet':
      px(ctx, cx - 5, ey + 1, K); px(ctx, cx - 4, ey, K); px(ctx, cx - 3, ey, K); px(ctx, cx - 2, ey + 1, K);
      px(ctx, cx + 2, ey + 1, K); px(ctx, cx + 3, ey, K); px(ctx, cx + 4, ey, K); px(ctx, cx + 5, ey + 1, K);
      px(ctx, cx - 2, my, K); rect(ctx, cx - 1, my + 1, 3, 1, K); px(ctx, cx + 2, my, K);
      rect(ctx, cx - 1, my, 3, 1, PAL.P);
      blush(); break;
    case 'sleep':
      rect(ctx, lx, ey + eh - 1, 2, 1, K); rect(ctx, rx, ey + eh - 1, 2, 1, K);
      px(ctx, cx, my, K); break;
    case 'sad':
      eyesNormal();
      px(ctx, cx - 2, ey - 2, K); px(ctx, cx - 3, ey - 2, K); px(ctx, cx - 4, ey - 1, K);
      px(ctx, cx + 3, ey - 2, K); px(ctx, cx + 4, ey - 2, K); px(ctx, cx + 5, ey - 1, K);
      px(ctx, cx - 2, my + 1, K); rect(ctx, cx - 1, my, 3, 1, K); px(ctx, cx + 2, my + 1, K);
      rect(ctx, cx + 5, ey + eh, 1, 2, PAL.b);
      break;
    case 'sick':
      px(ctx, cx - 5, ey, K); px(ctx, cx - 3, ey, K); px(ctx, cx - 4, ey + 1, K); px(ctx, cx - 5, ey + 2, K); px(ctx, cx - 3, ey + 2, K);
      px(ctx, cx + 3, ey, K); px(ctx, cx + 5, ey, K); px(ctx, cx + 4, ey + 1, K); px(ctx, cx + 3, ey + 2, K); px(ctx, cx + 5, ey + 2, K);
      px(ctx, cx - 2, my + 1, K); px(ctx, cx - 1, my, K); px(ctx, cx, my + 1, K); px(ctx, cx + 1, my, K); px(ctx, cx + 2, my + 1, K);
      rect(ctx, cx - 7, ny, 2, 1, '#9fd6a8'); rect(ctx, cx + 6, ny, 2, 1, '#9fd6a8');
      drawSpr(ctx, 'gota', cx + 5, ey - 6);
      break;
    case 'wow':
      eyesNormal(); rect(ctx, cx - 1, my, 3, 3, K); rect(ctx, cx, my + 1, 1, 1, PAL.P); break;
    case 'dead':
      px(ctx, cx - 5, ey, K); px(ctx, cx - 3, ey, K); px(ctx, cx - 4, ey + 1, K); px(ctx, cx - 5, ey + 2, K); px(ctx, cx - 3, ey + 2, K);
      px(ctx, cx + 3, ey, K); px(ctx, cx + 5, ey, K); px(ctx, cx + 4, ey + 1, K); px(ctx, cx + 3, ey + 2, K); px(ctx, cx + 5, ey + 2, K);
      rect(ctx, cx - 1, my, 3, 1, K); rect(ctx, cx, my + 1, 2, 2, PAL.P); break;
    case 'laugh':
      px(ctx, cx - 5, ey + 1, K); px(ctx, cx - 4, ey, K); px(ctx, cx - 3, ey, K); px(ctx, cx - 2, ey + 1, K);
      px(ctx, cx + 2, ey + 1, K); px(ctx, cx + 3, ey, K); px(ctx, cx + 4, ey, K); px(ctx, cx + 5, ey + 1, K);
      rect(ctx, cx - 2, my, 5, 3, K); rect(ctx, cx - 1, my + 1, 3, 1, PAL.P); rect(ctx, cx - 1, my, 3, 1, PAL.w);
      blush(); break;
    case 'eat':
      eyesNormal();
      if (Math.floor(t / 180) % 2 === 0){ rect(ctx, cx - 1, my, 3, 2, K); }
      else { rect(ctx, cx - 1, my, 3, 1, K); }
      blush(); break;
    default:
      eyesNormal(); mouthW();
  }
  rect(ctx, cx - 1, ny, 2, 1, PAL.P);
}

/* preenche as linhas de uma elipse entre y0 e y1 (inclusive) */
function ellipseRows(ctx, cx, cy, rx, ry, y0, y1, fn){
  for (let yy = y0; yy <= y1; yy++){
    const t = (yy - cy) / (ry + 0.5);
    if (t < -1 || t > 1) continue;
    const hw = rx * Math.sqrt(Math.max(0, 1 - t * t));
    fn(yy, Math.round(cx - hw), Math.round(cx + hw));
  }
}

/* roupa de corpo: g = {cx, cy, rx, ry, top, bottom, arms:[[x,y],...], feetY} */
function drawOutfit(ctx, key, g){
  const o = OUTFITS[key]; if (!o) return;
  const K = PAL.k;
  const layered = o.jacket || o.overalls || o.apron;
  const base = layered ? (o.under || '#fffaf0') : o.c;
  const baseD = layered ? (o.under ? o.d : '#dcd3c4') : o.d;
  if (g.top > g.bottom){
    for (const a of g.arms){
      fillEllipse(ctx, a[0], a[1] - 1, 2, 1, o.tank ? null : base);
      if (!o.tank) rect(ctx, a[0] - 2, a[1] + 1, 5, 1, baseD);
    }
    return;
  }
  const mid = Math.round((g.top + g.bottom) / 2);
  ellipseRows(ctx, g.cx, g.cy, g.rx, g.ry, g.top, g.bottom, (yy, x0, x1) => {
    if (o.tank && yy < g.top + 2){ rect(ctx, g.cx - 2, yy, 5, 1, base); return; }
    let col = base;
    if (o.stripes && ((yy - g.top) % 4 === 2 || (yy - g.top) % 4 === 3)) col = o.stripes;
    rect(ctx, x0, yy, x1 - x0 + 1, 1, col);
    if (o.plaid){ for (let xx = x0 + ((yy - g.top) % 2); xx <= x1; xx += 2) px(ctx, xx, yy, ((yy - g.top) % 4 < 2) ? o.d : '#fffaf0'); }
    px(ctx, x1, yy, baseD);
    if (yy === g.bottom) rect(ctx, x0, yy, x1 - x0 + 1, 1, baseD);
  });
  if (o.jacket){
    ellipseRows(ctx, g.cx, g.cy, g.rx, g.ry, g.top, g.bottom, (yy, x0, x1) => {
      rect(ctx, x0, yy, Math.max(0, g.cx - 2 - x0), 1, o.c);
      rect(ctx, g.cx + 3, yy, Math.max(0, x1 - g.cx - 2), 1, o.c);
      px(ctx, x1, yy, o.d); px(ctx, g.cx - 3, yy, o.d);
    });
    px(ctx, g.cx - 3, g.top, PAL.w); px(ctx, g.cx + 3, g.top, PAL.w);
  }
  if (o.overalls){
    ellipseRows(ctx, g.cx, g.cy, g.rx, g.ry, mid, g.bottom, (yy, x0, x1) => {
      rect(ctx, x0, yy, x1 - x0 + 1, 1, o.c); px(ctx, x1, yy, o.d);
    });
    rect(ctx, g.cx - 2, g.top + 1, 5, mid - g.top, o.c);
    rect(ctx, g.cx - 3, g.top, 1, mid - g.top, o.d); rect(ctx, g.cx + 3, g.top, 1, mid - g.top, o.d);
    px(ctx, g.cx - 1, g.top + 2, PAL.y); px(ctx, g.cx + 1, g.top + 2, PAL.y);
  }
  if (o.apron){
    ellipseRows(ctx, g.cx, g.cy, g.rx, g.ry, g.top + 2, g.bottom, (yy, x0, x1) => {
      const w = Math.max(0, Math.round((x1 - x0) * 0.6));
      rect(ctx, g.cx - Math.floor(w / 2), yy, w + 1, 1, o.c);
    });
    rect(ctx, g.cx - 3, g.top, 1, 3, o.d); rect(ctx, g.cx + 3, g.top, 1, 3, o.d);
    rect(ctx, g.cx - 2, mid + 1, 5, 2, o.d);
  }
  if (o.pocket){ rect(ctx, g.cx - 3, mid + 1, 7, 1, o.d); rect(ctx, g.cx - 3, mid + 1, 1, 3, o.d); rect(ctx, g.cx + 3, mid + 1, 1, 3, o.d); }
  if (o.hood){ rect(ctx, g.cx - 4, g.top, 9, 1, o.d); px(ctx, g.cx - 5, g.top + 1, o.d); px(ctx, g.cx + 5, g.top + 1, o.d); }
  /* gola */
  if (!o.overalls && !o.tank){ const gc = o.stripes ? o.d : PAL.w; px(ctx, g.cx - 1, g.top, gc); px(ctx, g.cx + 1, g.top, gc); px(ctx, g.cx, g.top + 1, gc); }
  if (o.tie){ rect(ctx, g.cx - 1, g.top + 1, 3, 1, o.tie); rect(ctx, g.cx, g.top + 2, 1, Math.max(2, mid - g.top), o.tie); px(ctx, g.cx, mid + 1, o.tie); }
  if (o.bow){ rect(ctx, g.cx - 2, g.top, 2, 2, o.bow); rect(ctx, g.cx + 1, g.top, 2, 2, o.bow); px(ctx, g.cx, g.top + 1, K); }
  /* estampa */
  if (o.print && g.bottom - g.top >= 6){
    const p = PRINTS[o.print];
    const px0 = g.cx - 2, py0 = mid - 1;
    for (let yy = 0; yy < 5; yy++) for (let xx = 0; xx < 5; xx++){
      const ch = p[yy][xx]; if (ch === '.') continue;
      const col = ch === 'k' ? K : PAL[ch]; px(ctx, px0 + xx, py0 + yy, col);
    }
  }
  /* saia */
  if (o.skirt){
    const y0 = g.bottom + 1, y1 = g.feetY - 1;
    for (let yy = y0; yy <= y1; yy++){
      const hw = g.rx + (yy - y0) + 1;
      rect(ctx, g.cx - hw, yy, hw * 2 + 1, 1, (yy - y0) % 2 ? o.d : o.c);
      if (o.plaid) for (let xx = g.cx - hw + ((yy - y0) % 2); xx <= g.cx + hw; xx += 3) px(ctx, xx, yy, '#fffaf0');
      px(ctx, g.cx - hw - 1, yy, K); px(ctx, g.cx + hw + 1, yy, K);
      if (yy === y1) rect(ctx, g.cx - hw - 1, yy + 1, hw * 2 + 3, 1, K);
    }
  }
  /* mangas */
  for (const a of g.arms){
    if (o.tank) continue;
    fillEllipse(ctx, a[0], a[1] - 1, 2, 1, layered ? (o.jacket ? o.c : base) : o.c);
    rect(ctx, a[0] - 2, a[1] + 1, 5, 1, layered ? (o.jacket ? o.d : baseD) : o.d);
  }
}

/* icone de camiseta para a loja */
const _outfitIcons = new Map();
function outfitIconURL(key){
  if (_outfitIcons.has(key)) return _outfitIcons.get(key);
  const o = OUTFITS[key];
  const c = document.createElement('canvas'); c.width = 12; c.height = 12;
  const g = c.getContext('2d');
  const rows = ['.kkk..kkk...', 'kcccccccck..', 'kkcccccckk..', '..kccccck...', '..kccccck...', '..kccccck...', '..kkkkkkk...'];
  const shape = o.skirt ? ['.kkk..kkk...', 'kcccccccck..', 'kkcccccckk..', '..kccccck...', '.kccccccck..', 'kcccccccccck', 'kkkkkkkkkkkk'] : rows;
  const layered = o.jacket || o.overalls || o.apron;
  shape.forEach((r, y) => { for (let x = 0; x < r.length; x++){ const ch = r[x]; if (ch === '.') continue; g.fillStyle = ch === 'k' ? PAL.k : (o.stripes && (y === 3 || y === 4) ? o.stripes : (o.overalls && y >= 3 ? o.c : (layered ? (o.under || '#fffaf0') : o.c))); g.fillRect(x, y + 2, 1, 1); } });
  if (o.jacket){ g.fillStyle = o.c; g.fillRect(3, 4, 2, 5); g.fillRect(7, 4, 2, 5); }
  if (o.apron){ g.fillStyle = o.d; g.fillRect(4, 5, 4, 4); }
  if (o.tie){ g.fillStyle = o.tie; g.fillRect(5, 4, 1, 4); }
  if (o.print){ g.fillStyle = o.print === 'coracao' ? PAL.h : o.print === 'estrela' ? PAL.y : o.print === 'nota' ? PAL.w : PAL.Y; g.fillRect(5, 6, 2, 2); }
  const u = c.toDataURL(); _outfitIcons.set(key, u); return u;
}

/* o = {stage, form, skin, face, t, flip, hat, outfit, sleeping, holding} ; (x,y) = centro dos pes */
function drawRat(ctx, x, y, o){
  o = o || {};
  const skin = SKINS[o.skin] || SKINS.bege;
  const t = o.t || 0;
  const stage = o.stage || 'baby';
  const form = FORMS[o.form];
  const chubby = !!(form && form.chubby && stage === 'adult');
  const still = o.sleeping || o.face === 'sick';
  const bob = still ? 0 : Math.floor(t / 520) % 2;
  const K = PAL.k;
  x = Math.round(x); y = Math.round(y);
  ctx.save();
  if (o.flip){ ctx.translate(2 * x, 0); ctx.scale(-1, 1); }

  let brx, bry, hrx = 0, hry = 0;
  if (stage === 'baby'){ brx = 7; bry = 6; }
  else if (stage === 'young'){ brx = 8; bry = 9; }
  else { brx = chubby ? 12 : 9; bry = chubby ? 9 : 7; hrx = 8; hry = 7; }
  const bcx = x, bcy = y - 3 - bry + bob;
  let hcx = x, hcy, HRX, HRY;
  if (hrx){ HRX = hrx; HRY = hry; hcy = bcy - bry - hry + 3; }
  else { HRX = brx; HRY = bry; hcy = bcy; }
  const ey = stage === 'baby' ? hcy - 1 : stage === 'young' ? hcy - 3 : hcy - 2;
  const eh = stage === 'baby' ? 2 : 3;
  const hat = o.hat && HATS[o.hat];

  /* mochila (atras do corpo) */
  if (hat && hat.where === 'back'){ const c = spriteCanvas(o.hat); if (c) drawSpr(ctx, o.hat, bcx + brx - 7, (hrx ? bcy - bry + 1 : bcy - 3)); }
  /* pes */
  oEllipse(ctx, x - 4, y - 2, 3, 1, PAL.p, K);
  oEllipse(ctx, x + 4, y - 2, 3, 1, PAL.p, K);
  /* rabo */
  const tx = bcx + brx - 2, ty = bcy + bry - 2;
  curve(ctx, [tx, ty], [tx + 10, ty + 3], [tx + 8, ty - 9], K, 3);
  curve(ctx, [tx, ty], [tx + 10, ty + 3], [tx + 8, ty - 9], PAL.P, 1);
  /* orelhas */
  const er = stage === 'baby' ? 3 : 4;
  const eox = HRX - 2, eoy = HRY - 2;
  for (const s of [-1, 1]){
    oEllipse(ctx, hcx + s * eox, hcy - eoy, er, er, skin.hood || skin.fur, K);
    fillEllipse(ctx, hcx + s * eox, hcy - eoy, er - 2, er - 2, PAL.p);
  }
  const arms = [];
  /* corpo (adulto) */
  if (hrx){
    oEllipse(ctx, bcx, bcy, brx, bry, skin.sh, K);
    fillEllipse(ctx, bcx - 1, bcy - 1, brx - 1, bry - 1, skin.fur);
    fillEllipse(ctx, bcx, bcy + 2, Math.round(brx * 0.5), Math.round(bry * 0.5), skin.belly);
    if (skin.spots){ fillEllipse(ctx, bcx + brx - 4, bcy - 2, 3, 2, skin.spots); }
    if (skin.hood){ rect(ctx, bcx - 1, bcy - bry + 1, 3, Math.round(bry * 0.9), skin.hood); }
    if (o.outfit) drawOutfit(ctx, o.outfit, {cx:bcx, cy:bcy, rx:brx, ry:bry, top:bcy - bry + 1, bottom:bcy + bry - 2, arms:[], feetY:y - 2});
    if (o.holding || o.armsUp){
      oEllipse(ctx, x - 5, hcy + HRY, 2, 2, skin.fur, K); oEllipse(ctx, x + 5, hcy + HRY, 2, 2, skin.fur, K);
    } else {
      oEllipse(ctx, bcx - brx + 1, bcy, 2, 3, skin.sh, K); oEllipse(ctx, bcx + brx - 1, bcy, 2, 3, skin.sh, K);
      arms.push([bcx - brx + 1, bcy], [bcx + brx - 1, bcy]);
    }
    if (o.outfit && arms.length) drawOutfit(ctx, o.outfit, {cx:bcx, cy:bcy, rx:0, ry:0, top:1, bottom:0, arms, feetY:y - 2});
  }
  /* cabeca (ou corpo unico) */
  oEllipse(ctx, hcx, hcy, HRX, HRY, skin.sh, K);
  fillEllipse(ctx, hcx - 1, hcy - 1, HRX - 1, HRY - 1, skin.fur);
  if (skin.hood){
    ellipseRows(ctx, hcx, hcy, HRX, HRY, hcy - HRY, ey - 1, (yy, x0, x1) => rect(ctx, x0, yy, x1 - x0 + 1, 1, skin.hood));
    rect(ctx, hcx - HRX, ey - 1, 2, 2, skin.hood); rect(ctx, hcx + HRX - 1, ey - 1, 2, 2, skin.hood);
  }
  if (!hrx){
    fillEllipse(ctx, hcx, hcy + Math.round(HRY * 0.45), Math.round(HRX * 0.45), Math.round(HRY * 0.35), skin.belly);
    if (o.outfit){
      drawOutfit(ctx, o.outfit, {cx:hcx, cy:hcy, rx:HRX, ry:HRY, top:hcy + 3, bottom:hcy + HRY - 2, arms:[], feetY:y - 2});
    }
    if (stage === 'young'){
      if (o.holding || o.armsUp){ oEllipse(ctx, x - 6, hcy + 3, 2, 2, skin.fur, K); oEllipse(ctx, x + 6, hcy + 3, 2, 2, skin.fur, K); }
      else {
        oEllipse(ctx, bcx - brx + 1, bcy + 3, 2, 2, skin.sh, K); oEllipse(ctx, bcx + brx - 1, bcy + 3, 2, 2, skin.sh, K);
        if (o.outfit) drawOutfit(ctx, o.outfit, {cx:bcx, cy:bcy, rx:0, ry:0, top:1, bottom:0, arms:[[bcx - brx + 1, bcy + 3], [bcx + brx - 1, bcy + 3]], feetY:y - 2});
      }
    }
  }
  if (skin.spots){
    fillEllipse(ctx, hcx - 4, hcy - HRY + 3, 2, 2, skin.spots);
    fillEllipse(ctx, hcx + eox, hcy - eoy - 1, 1, 1, skin.spots);
  }
  /* bigodes */
  if (stage !== 'baby'){
    rect(ctx, hcx - HRX - 1, ey + eh - 1, 2, 1, PAL.G); rect(ctx, hcx - HRX - 1, ey + eh + 1, 2, 1, PAL.G);
    rect(ctx, hcx + HRX, ey + eh - 1, 2, 1, PAL.G); rect(ctx, hcx + HRX, ey + eh + 1, 2, 1, PAL.G);
  }
  /* rosto */
  const face = o.sleeping ? 'sleep' : (o.face || 'normal');
  drawFace(ctx, hcx, ey, stage, face, t, skin === SKINS.rosinha ? PAL.P : PAL.p);
  if (chubby){ px(ctx, hcx + 3, ey + eh + 3, PAL.n); }

  /* acessorios */
  const headTop = hcy - HRY - 1;
  const neckY = hrx ? hcy + HRY - 1 : hcy + HRY - 3;
  const ny = ey + eh;
  const place = (name, where, dx, dy) => {
    const c = spriteCanvas(name); if (!c) return;
    const sx = hcx - Math.floor(c.width / 2) + (dx || 0);
    if (where === 'head') drawSpr(ctx, name, hcx - 7 + (dx || 0), headTop - c.height + 3 + (dy || 0));
    else if (where === 'eyes') drawSpr(ctx, name, hcx - 7 + (dx || 0), ey - 2 + (dy || 0));
    else if (where === 'brow') drawSpr(ctx, name, hcx - 7 + (dx || 0), ey - 3 + (dy || 0));
    else if (where === 'neck') drawSpr(ctx, name, hcx - 7 + (dx || 0), neckY - 2 + (dy || 0));
    else if (where === 'nose') drawSpr(ctx, name, sx, ny - 1 + (dy || 0));
  };
  if (form && form.acc && stage === 'adult' && !(hat && hat.where === form.where)) place(form.acc, form.where, 0, 0);
  if (hat && hat.where !== 'back') place(o.hat, hat.where, hat.dx, hat.dy);

  if (o.holding) drawSpr(ctx, o.holding, hcx - 4, hcy + HRY - 5);
  if (o.sleeping){
    const ph = Math.floor(t / 600) % 3;
    drawSpr(ctx, 'zzz', hcx + HRX + 3, headTop - 6 - ph * 2, {alpha:0.9});
    if (ph > 0) drawSpr(ctx, 'zzz', hcx + HRX + 9, headTop - 14 - ph, {alpha:0.6});
  }
  ctx.restore();
}

const K = PAL.k;
function ringRows(ctx, cx, cy, rOut, rIn, color){
  ctx.fillStyle = color;
  cx = Math.round(cx); cy = Math.round(cy);
  for (let dy = -Math.round(rOut); dy <= Math.round(rOut); dy++){
    const t = dy / (rOut + 0.5); if (t < -1 || t > 1) continue;
    const ho = rOut * Math.sqrt(Math.max(0, 1 - t * t));
    const ti = dy / (rIn + 0.5);
    const hi = Math.abs(ti) < 1 ? rIn * Math.sqrt(1 - ti * ti) : 0;
    if (hi <= 0){ ctx.fillRect(Math.round(cx - ho), cy + dy, Math.round(cx + ho) - Math.round(cx - ho) + 1, 1); }
    else {
      ctx.fillRect(Math.round(cx - ho), cy + dy, Math.max(1, Math.round(cx - hi) - Math.round(cx - ho)), 1);
      ctx.fillRect(Math.round(cx + hi) + 1, cy + dy, Math.max(1, Math.round(cx + ho) - Math.round(cx + hi)), 1);
    }
  }
}
/* livros numa prateleira */
function books(ctx, x, y, w, h){
  const cols = [PAL.r, PAL.b, PAL.e, PAL.y, PAL.v, PAL.o];
  let xx = x, i = 0;
  while (xx < x + w - 2){ const bw = 2 + (i % 2); const bh = h - (i % 3 === 1 ? 2 : 0); rect(ctx, xx, y + h - bh, bw, bh, cols[i % cols.length]); px(ctx, xx, y + h - bh, K); xx += bw + 1; i++; }
}
/* vista da janela: ceu conforme a hora de verdade e o clima do dia */
function drawWindowView(ctx, x, y, w, h, t, cat){
  const hr = new Date().getHours() + new Date().getMinutes() / 60;
  const night = hr < 6 || hr >= 19, dusk = !night && (hr < 7 || hr >= 17);
  const wt = typeof todayWeather === 'function' ? todayWeather() : 'sol';
  const gray = wt === 'chuva' || wt === 'neve';
  rect(ctx, x, y, w, h, night ? (gray ? '#141020' : '#1b1233') : gray ? '#9aa4b8' : dusk ? '#f5b06c' : '#9ad4f5');
  if (night && !gray){ px(ctx, x + 3, y + 3, PAL.w); px(ctx, x + w - 5, y + 5, PAL.w); px(ctx, x + w / 2, y + 2, PAL.w); fillEllipse(ctx, x + w - 6, y + 6, 3, 3, '#fff3b0'); }
  else if (!night && !gray){ fillEllipse(ctx, x + w - 6, y + 5, 3, 3, dusk ? PAL.o : PAL.y); }
  if (wt === 'nuvens' || gray){ const cc = gray ? '#c9c3d6' : PAL.w; fillEllipse(ctx, x + 6, y + 5, 5, 2, cc); fillEllipse(ctx, x + w - 8, y + 8, 6, 2, cc); }
  const now = performance.now();
  if (wt === 'chuva') for (let i = 0; i < 6; i++){ const dy = ((now / 50) + i * 9) % (h - 4); px(ctx, x + 2 + ((i * 7) % (w - 4)), y + dy, '#5aa9e6'); }
  if (wt === 'neve') for (let i = 0; i < 6; i++){ const dy = ((now / 120) + i * 9) % (h - 4); px(ctx, x + 2 + ((i * 7 + Math.floor(dy / 6)) % (w - 4)), y + dy, PAL.w); }
  rect(ctx, x, y + h - 4, w, 4, wt === 'neve' ? '#eaf6fa' : night ? '#2f4149' : '#6ccf7a'); rect(ctx, x, y + h - 4, w, 1, wt === 'neve' ? '#c9d9e6' : night ? '#3c5361' : '#3c9a4c');
  if (t != null){
    const bx = x + ((t / 40) % (w + 10)) - 5;
    if (!cat && wt !== 'chuva'){ px(ctx, bx, y + 6, K); px(ctx, bx + 1, y + 5, K); px(ctx, bx + 2, y + 6, K); px(ctx, bx + 6, y + 9, K); px(ctx, bx + 7, y + 8, K); px(ctx, bx + 8, y + 9, K); }
  }
  if (cat){ const c = spriteCanvas('gato'); if (c) ctx.drawImage(c, x + Math.floor((w - 16) / 2), y + h - 4 - 12); }
}

function drawWheelBack(ctx, cx, cy, r, colors){
  fillEllipse(ctx, cx, cy, r + 1, r + 1, K);
  fillEllipse(ctx, cx, cy, r, r, (colors && colors.inner) || '#e3dff0');
}
function drawWheelFront(ctx, cx, cy, r, ang, alpha, colors){
  const rim = (colors && colors.rim) || PAL.g, spoke = (colors && colors.spoke) || PAL.G;
  ctx.save();
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  ringRows(ctx, cx, cy, r + 1, r - 3, rim);
  ringRows(ctx, cx, cy, r + 1, r, K);
  ringRows(ctx, cx, cy, r - 2, r - 3, K);
  for (let i = 0; i < 6; i++){
    const a = ang + i * Math.PI / 3;
    const ex = cx + Math.cos(a) * (r - 3), ey = cy + Math.sin(a) * (r - 3);
    const n = Math.ceil(r);
    for (let s = 2; s <= n; s++){ const q = s / n; px(ctx, cx + (ex - cx) * q, cy + (ey - cy) * q, spoke); }
  }
  fillEllipse(ctx, cx, cy, 2, 2, K); px(ctx, cx, cy, rim);
  ctx.restore();
}

function dayKey(d){ d = d || new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }

function checkStreak(){
  if (!S.started) return null;

  const y = new Date(); y.setDate(y.getDate() - 1);
  S.streak = (S.lastDay === dayKey(y)) ? (S.streak || 0) + 1 : 1;
  S.lastDay = today;
  const r = STREAK_REWARDS[Math.min(S.streak, 7) - 1];
  let text = r.text;
  if (r.coins) S.coins += r.coins;
  if (r.food) S.inv[r.food] = (S.inv[r.food] || 0) + r.n;
  if (r.rare){
    const pool = Object.keys(HATS).filter(k => !S.hats.includes(k) && (HATS[k].stage || 'baby') === 'baby').concat(Object.keys(OUTFITS).filter(k => !S.outfits.includes(k) && (OUTFITS[k].stage || 'baby') === 'baby'));

    else { S.coins += 100; text = '100 moedas'; }

    for (const k of S.decor){ if (DECOR[k] && DECOR[k].tiers && S.decorTier[k] == null) S.decorTier[k] = 1; }
    S.uses = d.uses || {}; S.bank = d.bank || 0; S.hidden = !!d.hidden;
    if (S.paper && !DECOR[S.paper]) S.paper = '';
    S.room = Math.min(ROOMS.length - 1, Math.max(0, d.room || 0));
    if (!S.fav || !FOODS[S.fav]) pickFoods();

    if (!S.lastDay){ S.lastDay = dayKey(); S.streak = 1; }
    if (d.xp == null){
      const st = S.stats || {};
      S.xp = Math.floor(S.age || 0) + (st.fed || 0) * 4 + (st.played || 0) * 10 + (st.baths || 0) * 5;
      if (S.stage === 'young') S.xp = Math.max(S.xp, xpForLevel(STAGES.young.level));
      if (S.stage === 'adult') S.xp = Math.max(S.xp, xpForLevel(STAGES.adult.level));
      S.level = levelFromXp(S.xp); S.xpAcc = 0;

  } catch (e) { return false; }
}
/* ---- niveis ---- */
function xpNeed(l){ return 30 + (l - 1) * 15; }
function xpForLevel(l){ let s = 0; for (let i = 1; i < l; i++) s += xpNeed(i); return s; }
function levelFromXp(xp){ let l = 1; while (l < 99 && xp >= xpForLevel(l + 1)) l++; return l; }
function stageForLevel(l){ return l >= STAGES.adult.level ? 'adult' : l >= STAGES.young.level ? 'young' : 'baby'; }
function levelProgress(){ const a = xpForLevel(S.level), b = xpForLevel(S.level + 1); return {cur:S.xp - a, need:b - a, pct:Math.max(0, Math.min(1, (S.xp - a) / (b - a)))}; }
function addXp(n){
  if (!S.started || n <= 0) return;
  S.xp += n;
  const nl = levelFromXp(S.xp);
  while (S.level < nl){
    S.level++; S.coins += 5;
    S.pending.push('level:' + S.level);
    const st = stageForLevel(S.level);
    if (stageRank(st) > stageRank(S.stage)) evolveTo(st);
  }
}

function computeForm(){
  const c = S.care, t = c.t || 1;
  const avg = {hunger:c.hunger / t, energy:c.energy / t, hygiene:c.hygiene / t, fun:c.fun / t};
  if (S.weight >= 90) return 'bolota';
  const vals = Object.values(avg);
  const mean = vals.reduce((a, b) => a + b, 0) / 4;
  if (vals.every(v => v >= 75)) return 'rei';
  if (mean < 40) return 'comum';
  const best = Object.entries(avg).sort((a, b) => b[1] - a[1])[0][0];
  return {hunger:'chef', fun:'atleta', energy:'dorminhoco', hygiene:'limpinho'}[best];
}

/* um passo de simulacao de "ms" milissegundos */
function tick(ms){
  if (!S.started) return;
  const h = ms / HOUR;
  const sm = S.sleeping ? 0.5 : 1;
  /* ritmo: da para manter tudo em dia entrando 3 vezes por dia */
  S.hunger  = clamp(S.hunger - 5 * h * sm);
  S.fun     = clamp(S.fun - (5 + (S.sick ? 1.5 : 0)) * h * sm * (S.hidden ? 0.5 : 1));
  if (S.decor.includes('cofre')) S.bank = Math.min(S.decorTier && S.decorTier.cofre ? 24 : 12, (S.bank || 0) + h);
  S.hygiene = clamp(S.hygiene - (3.5 + S.poops * 0.7) * h * (hasUpgrade('pia') ? 0.7 : 1));
  if (S.sleeping){
    /* enche do zero em 3 h na caixa de fosforo e em 1 h 30 na cama de boneca */
    S.energy = clamp(S.energy + (hasUpgrade('cama') ? 100 / 1.5 : 100 / 3) * h);
    if (S.energy >= 100){ S.sleeping = false; S.pending.push('woke'); addXp(8); }
  } else {
    S.energy = clamp(S.energy - 6 * h);
    if (S.energy <= 10){ S.sleeping = true; S.pending.push('autosleep'); }
  }
  S.age += h;
  S.xpAcc = (S.xpAcc || 0) + h;
  while (S.xpAcc >= 1){ S.xpAcc -= 1; addXp(1); }
  if (S.stage === 'young'){
    S.care.hunger += S.hunger * h; S.care.energy += S.energy * h;
    S.care.hygiene += S.hygiene * h; S.care.fun += S.fun * h; S.care.t += h;
  }
  if (!S.sleeping && S.hunger > 5){
    S.nextPoop -= h;
    if (S.nextPoop <= 0){
      if (S.poops < 3){ S.poops++; S.pending.push('poop'); }
      S.nextPoop = (4 + Math.random() * 3) * (hasUpgrade('privada') ? 1.5 : 1);
    }
  }
  if (!S.sick){
    S.sickAcc += h;
    while (S.sickAcc >= 1){
      S.sickAcc -= 1;
      let risk = 0;
      if (S.hygiene < 15) risk += 0.05;
      if (S.hunger < 10) risk += 0.04;
      if (S.poops >= 3) risk += 0.05;
      if (S.energy < 5) risk += 0.02;
      if (risk > 0 && Math.random() < risk){ S.sick = true; S.pending.push('sick'); break; }
    }
  }
}
function simulate(ms){
  let left = Math.max(0, ms);
  const step = 10 * 60000;
  while (left > 0){ const d = Math.min(step, left); left -= d; tick(d); }
}

function mood(){
  if (S.sick) return 'sick';
  if (S.sleeping) return 'sleep';
  const lo = Math.min(S.hunger, S.energy, S.hygiene, S.fun);
  if (lo < 20) return 'sad';
  const avg = (S.hunger + S.energy + S.hygiene + S.fun) / 4;
  if (avg > 70) return 'happy';
  return 'ok';
}
function needs(){
  const n = [];
  if (S.hunger < 30) n.push('hunger');
  if (S.energy < 25 && !S.sleeping) n.push('energy');
  if (S.hygiene < 30 || S.poops > 0) n.push('hygiene');
  if (S.fun < 30) n.push('fun');
  if (S.sick) n.push('sick');
  return n;
}

/* ---- acoes ---- */
function feed(key){
  const f = FOODS[key];
  if (!f) return {ok:false, msg:'Hmm?'};
  if (S.sleeping) return {ok:false, msg:'Shh... ' + S.name + ' está dormindo.'};
  if ((S.inv[key] || 0) <= 0) return {ok:false, msg:'Acabou. Compre mais na loja.'};
  if (S.hunger >= 95 && f.fun === 0) return {ok:false, msg:S.name + ' está cheio!'};
  S.inv[key]--;
  S.hunger = clamp(S.hunger + f.hunger);
  let fun = (f.fun || 0) + (hasUpgrade('mesa') ? 5 : 0), msg = 'Nhac nhac!', mood = 'ok';
  if (key === S.fav){ fun = fun * 2 + 10; msg = 'Minha comida favorita!'; mood = 'fav'; S.favKnown = true; }
  else if (key === S.hate){ fun = -3; msg = 'Eca... isso não!'; mood = 'hate'; S.hateKnown = true; }
  S.fun = clamp(S.fun + fun);
  if (f.energy) S.energy = clamp(S.energy + f.energy * (hasUpgrade('fogao') ? 2 : 1));
  if (f.hygiene) S.hygiene = clamp(S.hygiene + f.hygiene);
  S.weight = clamp(S.weight + f.w, 20, 200);
  S.stats.fed++;
  addXp(4);
  save();
  return {ok:true, msg, mood};
}
function toggleLight(){

    S.sleeping = false;
    if (S.energy < 100){ S.fun = clamp(S.fun - 5); save(); return {ok:true, msg:S.name + ' acordou rabugento...'}; }
    save(); return {ok:true, msg:'Bom dia, ' + S.name + '!'};
  }
  S.sleeping = true;
  save();
  return {ok:true, msg:'Boa noite, ' + S.name + '...'};
}
function bath(){
  if (S.sleeping) return {ok:false, msg:'Shh... ' + S.name + ' está dormindo.'};
  const had = S.poops > 0 || S.hygiene < 100;
  S.hygiene = 100; S.poops = 0; S.stats.baths++;
  if (hasUpgrade('banheira')) S.fun = clamp(S.fun + 5);
  if (had) addXp(5);
  save();
  return {ok:true, msg:had ? 'Splish splash! Limpinho.' : 'Já estava limpinho!'};
}
function cleanPoop(){
  if (S.poops <= 0) return {ok:false};

  return {ok:true, msg:'Eca! Limpou.'};
}
function medicine(){
  if (!S.sick) return {ok:false, msg:S.name + ' está saudável!'};

/* kind: 'head' (carinho), 'belly' (cocegas), 'ear' (orelha), 'cuddle' (cafune longo) */
function petRat(kind){

  const now = Date.now();

    S.fun = clamp(S.fun + (kind === 'cuddle' ? 5 : 3) + (hasUpgrade('sofa') ? 2 : 0));
    S.stats.pets++; _lastPet = now; addXp(1); save();
  }
  return {ok:true, msg:''};
}
function finishGame(id, score, coins){
  if (hasUpgrade('estante')) coins += 1;
  S.coins += coins;
  addXp(8 + Math.min(12, coins));
  S.fun = clamp(S.fun + 25);
  S.energy = clamp(S.energy - 4);
  S.weight = clamp(S.weight - 2, 20, 200);

}
function outfitPrice(key){ return Math.max(5, OUTFITS[key].price - (hasUpgrade('comoda') ? 5 : 0)); }
/* cat: food | hat | outfit | decor | furn | skin ; tier: para decoracoes com duas versoes (0 barata, 1 pet shop) */
function buy(cat, key, tier){
  let price, owned = false;
  if (cat === 'food'){ price = foodPrice(key); }
  else if (cat === 'hat'){ price = HATS[key].price; owned = S.hats.includes(key); if (stageRank(HATS[key].stage || 'baby') > stageRank(S.stage)) return {ok:false, msg:'Libera na fase ' + STAGES[HATS[key].stage].name + '.'}; }
  else if (cat === 'outfit'){ price = outfitPrice(key); owned = S.outfits.includes(key); if (stageRank(OUTFITS[key].stage || 'baby') > stageRank(S.stage)) return {ok:false, msg:'Libera na fase ' + STAGES[OUTFITS[key].stage].name + '.'}; }
  else if (cat === 'decor'){
    const d = DECOR[key];
    if (d.tiers){ tier = tier || 0; price = d.tiers[tier].price; owned = S.decor.includes(key) && decorTier(key) >= tier; }
    else { price = d.price; owned = S.decor.includes(key); }
  }
  else if (cat === 'furn'){ price = FURN[key].tiers[1].price; owned = hasUpgrade(key); }
  else if (cat === 'skin'){ price = SKINS[key].price; owned = S.skins.includes(key); }
  if (owned) return {ok:false, msg:'Você já tem esse.'};
  if (S.coins < price) return {ok:false, msg:'Faltam ' + (price - S.coins) + ' moedas.'};
  S.coins -= price;
  if (cat === 'food'){ S.inv[key] = (S.inv[key] || 0) + 1; }
  else if (cat === 'hat'){ S.hats.push(key); S.hat = key; }
  else if (cat === 'outfit'){ S.outfits.push(key); S.outfit = key; }
  else if (cat === 'decor'){
    if (!S.decor.includes(key)) S.decor.push(key);
    if (DECOR[key].tiers){ S.decorTier[key] = tier || 0; }
    if (DECOR[key].kind === 'paper') S.paper = key;
  }
  else if (cat === 'furn'){ S.furn[key] = 1; }
  else if (cat === 'skin'){ S.skins.push(key); S.skin = key; }
  save();
  return {ok:true, msg:'Comprado!'};
}

/* ===== Sons de bip (Web Audio) ===== */
const SFX = (() => {
  let ac = null;
  let enabled = true;
  function ensure(){
    if (!ac){
      try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; }
    }
    if (ac && ac.state === 'suspended') ac.resume();
  }
  function tone(f, dur, when, vol, type){
    if (!ac || !enabled) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square';
    o.frequency.value = f;
    const v = vol || 0.06;
    const t0 = ac.currentTime + (when || 0);
    g.gain.setValueAtTime(v, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  const seqs = {
    blip:  [[880, .05]],
    ok:    [[660, .06], [990, .08, .06]],
    back:  [[440, .06], [330, .08, .06]],
    eat:   [[300, .05], [260, .05, .09], [300, .05, .18], [260, .05, .27]],
    happy: [[523, .08], [659, .08, .08], [784, .08, .16], [1046, .18, .24]],
    sad:   [[400, .15], [300, .25, .15]],
    sick:  [[200, .2], [180, .25, .2]],
    coin:  [[988, .05], [1319, .12, .05]],
    jump:  [[500, .06], [800, .06, .05]],
    hit:   [[150, .18]],
    evolve:[[523, .1], [659, .1, .1], [784, .1, .2], [1046, .1, .3], [1318, .35, .4]],
    sleep: [[440, .15], [349, .15, .15], [262, .3, .3]],
    wake:  [[262, .08], [392, .08, .08], [523, .15, .16]],
    buy:   [[784, .06], [988, .06, .06], [1175, .12, .12]],
    no:    [[220, .08], [220, .08, .12]],
    pet:   [[1046, .04], [1318, .06, .05]],
    flip:  [[700, .04]],
    win:   [[659, .1], [784, .1, .1], [1046, .1, .2], [784, .1, .3], [1046, .3, .4]]
  };
  function play(name){
    ensure();
    const s = seqs[name]; if (!s) return;
    for (const [f, d, w] of s) tone(f, d, w || 0);
  }
  function note(f, dur, vol, type){ ensure(); tone(f, dur || 0.15, 0, vol || 0.06, type || 'square'); }
  return {
    play, ensure, note,
    set on(v){ enabled = !!v; },
    get on(){ return enabled; }
  };
})();

function useCooldown(key){

function useItem(key){

function goRoom(idx, dir){
  const n = ROOMS.length;
  idx = ((idx % n) + n) % n;
  if (idx === SCENE.room) return;
  const d = dir || (idx > SCENE.room ? 1 : -1);
  SCENE.trans = {from:SCENE.room, to:idx, start:performance.now(), dir:d};
  SCENE.riding = false;
  if (SCENE.anim && SCENE.anim.type !== 'evolve') SCENE.anim = null;
  SCENE.room = idx; S.room = idx;
  SCENE.ratX = d > 0 ? W + 16 : -16;
  SCENE.ratY = Math.min(Math.max(SCENE.ratY, LAY.walkTop), LAY.walkBottom);

function updateScene(dt, t){
  if (SCENE.trans && t - SCENE.trans.start > 280) SCENE.trans = null;
  for (const k of Object.keys(SCENE.active)) if (t > SCENE.active[k].until) delete SCENE.active[k];
  if (SCENE.riding){
    const dx = SCENE.targetX - SCENE.ratX, dy = SCENE.targetY - SCENE.ratY;
    const dist = Math.hypot(dx, dy);
    if (dist > 0.5){
      const v = 58 * dt / 1000, k = Math.min(1, v / dist), mv = dist * k;
      SCENE.ratX += dx * k; SCENE.ratY += dy * k;
      if (Math.abs(dx) > 1) SCENE.dir = dx < 0 ? -1 : 1;
      SCENE.wheelAng += (dx < 0 ? -1 : 1) * mv / WHEEL_R;
      SCENE.rideDist += mv; S.stats.ride = (S.stats.ride || 0) + mv;
      if (SCENE.rideDist > 40){ SCENE.rideDist = 0; S.fun = clamp(S.fun + 1); S.energy = clamp(S.energy - 0.3); if (Math.random() < 0.3) addHearts(1); }
    }
  } else if (S.started && !S.sleeping && !S.hidden && !SCENE.anim && mood() !== 'sick'){
    SCENE.walkT -= dt;
    if (SCENE.walkT <= 0){
      SCENE.walkT = 2500 + Math.random() * 5000;
      if (Math.random() < 0.65) randomWalkTarget();
    }
    SCENE.idleT = (SCENE.idleT == null ? 6000 : SCENE.idleT) - dt;
    if (SCENE.idleT <= 0){ SCENE.idleT = 9000 + Math.random() * 14000; startIdle(); }
    const dx = SCENE.targetX - SCENE.ratX, dy = SCENE.targetY - SCENE.ratY;
    const dist = Math.hypot(dx, dy);
    if (dist > 0.5){
      const v = (dist > 40 ? 32 : 13) * dt / 1000;
      const k = Math.min(1, v / dist);
      SCENE.ratX += dx * k; SCENE.ratY += dy * k;
      if (Math.abs(dx) > 1) SCENE.dir = dx < 0 ? -1 : 1;
    }
  }
  if (t > SCENE.blinkAt){
    SCENE.blinking = !SCENE.blinking;
    SCENE.blinkAt = t + (SCENE.blinking ? 120 : 2200 + Math.random() * 2500);
  }
  if (SCENE.anim && t > SCENE.anim.until) SCENE.anim = null;
  SCENE.fx = SCENE.fx.filter(f => t < f.until);
}

const UI = (() => {

  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'}[c]));

  /* elementos fixos (barra de cima, setas) sobrevivem aos paineis */
  function fixed(cls, html){
    let e = el.querySelector('.' + cls.split(' ')[0]);
    if (!e){ e = document.createElement('div'); e.className = cls; el.appendChild(e); }
    if (html != null) e.innerHTML = html;
    return e;
  }
  function clearPanel(){
    el.querySelectorAll('.panel, .title, .toast').forEach(x => x.remove());
    panel = null; acts = {}; onBack = null; focusIdx = -1; toastEl = null;
  }
  function open(name, h, map, back){
    clearPanel();
    panel = name; acts = map || {}; onBack = back || null;
    const wrap = document.createElement('div');
    wrap.innerHTML = h;
    while (wrap.firstChild) el.appendChild(wrap.firstChild);
    setFocus(0);
  }
  function close(){ if (panel) clearPanel(); }
  function isOpen(){ return !!panel; }
  function current(){ return panel; }
  function items(){ return Array.from(el.querySelectorAll('.panel .opt:not(.disabled), .panel .tab, .title .opt')); }
  function setFocus(i){
    const it = items(); if (!it.length){ focusIdx = -1; return; }
    it.forEach(x => x.classList.remove('focus'));
    focusIdx = ((i % it.length) + it.length) % it.length;
    it[focusIdx].classList.add('focus');
    try { it[focusIdx].scrollIntoView({block:'nearest'}); } catch (e) {}
  }
  el.addEventListener('click', e => {
    const t = e.target.closest('[data-act]');
    if (!t || t.classList.contains('disabled')) return;
    SFX.ensure();
    const fn = acts[t.dataset.act];
    if (fn) fn(t.dataset.arg, t);
  });
  el.addEventListener('pointerdown', e => {
    const t = e.target.closest('.opt, .tab');
    if (!t) return;
    const it = items(); const i = it.indexOf(t); if (i >= 0) setFocus(i);
  });

  /* teclado no PC: A mover, B ok, C voltar. */
  function button(k){
    if (!panel) return false;
    if (panel === 'title'){ acts.go && acts.go(); return true; }
    if (panel === 'intro'){ if (k !== 'C'){ acts.next && acts.next(); } return true; }
    if (k === 'A'){ SFX.play('blip'); setFocus(focusIdx + 1); return true; }
    if (k === 'B'){
      const it = items();
      if (focusIdx >= 0 && it[focusIdx]){ it[focusIdx].click(); }
      else if (panel === 'name'){ acts.confirm && acts.confirm(); }
      return true;
    }
    if (k === 'C'){ if (onBack) onBack(); else close(); return true; }
    return true;
  }

  /* ---------- barra de cima e setas de comodo ---------- */
  function topbar(roomName, coins, level, pct){
    const t = fixed('topbar');
    const html = '<span>' + esc(roomName) + '</span>' +
      '<span class="lvl">NV ' + level + '<i><b style="width:' + Math.round(pct * 100) + '%"></b></i></span>' +
      '<span class="coins"><img alt="" src="' + sprURL('moeda') + '">' + coins + '</span>';
    if (t.innerHTML !== html) t.innerHTML = html;
    t.hidden = false;
  }
  function hideTop(){ const t = el.querySelector('.topbar'); if (t) t.hidden = true; }
  function nav(cb){
    navCb = cb;
    let l = el.querySelector('.nav.l'), r = el.querySelector('.nav.r');
    if (!l){
      l = document.createElement('button'); l.className = 'nav l'; l.textContent = '<'; l.setAttribute('aria-label', 'Cômodo anterior');
      r = document.createElement('button'); r.className = 'nav r'; r.textContent = '>'; r.setAttribute('aria-label', 'Próximo cômodo');
      l.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); navCb && navCb(-1); });
      r.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); navCb && navCb(1); });
      el.appendChild(l); el.appendChild(r);
    }
    l.hidden = r.hidden = false;
  }
  function hideNav(){ el.querySelectorAll('.nav').forEach(x => { x.hidden = true; }); }

  /* ---------- balao de fala ---------- */
  function toast(msg, ms){
    if (!msg) return;
    if (toastEl && toastEl.parentNode) toastEl.remove();
    toastEl = document.createElement('div');
    toastEl.className = 'toast';
    toastEl.textContent = msg;
    el.appendChild(toastEl);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { if (toastEl && toastEl.parentNode) toastEl.remove(); toastEl = null; }, ms || 2200);
  }

  function streakPanel(day, text){

  function shop(tab){
    tab = tab || 'food';
    const tabs = [['food', 'Comida'], ['wear', 'Roupas'], ['home', 'Toca'], ['skin', 'Cores']];
    const row = (act, key, icon, name, meta, cls) =>
      '<button class="opt ' + cls + '" data-act="' + act + '" data-arg="' + key + '">' + icon +
      '<span class="name">' + (name.indexOf('<img') >= 0 ? esc(name.split('<img')[0]) + '<img' + name.split('<img')[1] : esc(name)) + '</span><span class="meta">' + meta + '</span></button>';
    const swatch = col => '<span class="ico" style="background:' + col + ';border:2px solid #3a2a4a;border-radius:50%"></span>';
    let list = '';
    if (tab === 'food'){
      list = Object.keys(FOODS).map(k => row('buy', 'food:' + k, sprImg(k), FOODS[k].name, foodPrice(k) + ' · x' + (S.inv[k] || 0), '')).join('');
    } else if (tab === 'wear'){
      const groups = [['baby', 'Para todas as idades'], ['young', 'Adolescente'], ['adult', 'Adulto']];
      const locked = st => stageRank(st) > stageRank(S.stage);
      list += '<h3>Acessórios</h3>';
      list += row('wearHat', '', sprImg('brilho'), 'Sem acessório', S.hat ? 'tirar' : 'ok', S.hat ? '' : 'owned');
      for (const [stg, title] of groups){
        list += '<h3>' + title + (locked(stg) ? ' · libera no nível ' + STAGES[stg].level : '') + '</h3>';
        list += Object.keys(HATS).filter(k => (HATS[k].stage || 'baby') === stg).map(k => {
          const owned = S.hats.includes(k), on = S.hat === k, lk = !owned && locked(stg);
          if (sellMode) return owned ? row('sellAsk', 'hat:' + k, sprImg(k), HATS[k].name, 'vender +' + Math.floor(HATS[k].price / 2), 'danger') : '';
          return row(owned ? 'wearHat' : lk ? 'none' : 'buy', owned ? k : 'hat:' + k, sprImg(k), HATS[k].name, owned ? (on ? 'usando' : 'usar') : lk ? 'bloqueado' : HATS[k].price + '', owned ? 'owned' : lk ? 'disabled' : '');
        }).join('');
      }
      list += '<h3>Roupas</h3>';
      list += row('wearOutfit', '', sprImg('brilho'), 'Sem roupa', S.outfit ? 'tirar' : 'ok', S.outfit ? '' : 'owned');
      for (const [stg, title] of groups){
        list += '<h3>' + title + (locked(stg) ? ' · libera no nível ' + STAGES[stg].level : '') + '</h3>';
        list += Object.keys(OUTFITS).filter(k => (OUTFITS[k].stage || 'baby') === stg).map(k => {
          const owned = S.outfits.includes(k), on = S.outfit === k, lk = !owned && locked(stg);
          const icon = '<img class="ico" alt="" src="' + outfitIconURL(k) + '">';
          if (sellMode) return owned ? row('sellAsk', 'outfit:' + k, icon, OUTFITS[k].name, 'vender +' + Math.floor(OUTFITS[k].price / 2), 'danger') : '';
          return row(owned ? 'wearOutfit' : lk ? 'none' : 'buy', owned ? k : 'outfit:' + k, icon, OUTFITS[k].name, owned ? (on ? 'usando' : 'usar') : lk ? 'bloqueado' : outfitPrice(k) + '', owned ? 'owned' : lk ? 'disabled' : '');
        }).join('');
      }
    } else if (tab === 'home'){
      const fi = (draw, w, h) => '<img class="ico" alt="" src="' + furnIconURL(draw, w, h) + '">';
      for (const room of ROOMS){
        const where = 'no ' + (room.id === 'sala' || room.id === 'cozinha' ? room.name.toLowerCase().replace(/^/, '') : room.name.toLowerCase());
        const inRoomTxt = (room.id === 'sala' || room.id === 'cozinha') ? 'na ' + room.name.toLowerCase() : 'no ' + room.name.toLowerCase();
        list += '<h3>' + esc(room.name) + ' · móveis</h3>';
        list += room.slots.map(key => {
          const f = FURN[key], up = hasUpgrade(key), t1 = f.tiers[1];
          if (sellMode) return up ? row('sellAsk', 'furn:' + key, fi(t1.draw, t1.w, t1.h), t1.name, 'vender +' + Math.floor(t1.price / 2), 'danger') : '';
          return row(up ? 'none' : 'buy', up ? key : 'furn:' + key, fi(t1.draw, t1.w, t1.h), t1.name, up ? inRoomTxt : t1.price + '', up ? 'owned' : '');
        }).join('');
        list += '<h3>' + esc(room.name) + ' · decoração e brinquedos</h3>';
        const ev = currentEvent();
        list += Object.keys(DECOR).filter(k => DECOR[k].room === room.id).map(k => {
          const d = DECOR[k], owned = S.decor.includes(k), paper = d.kind === 'paper';
          if (d.event && !owned && !(ev && ev.id === d.event)) return '';
          if (sellMode){
            if (!owned) return '';
            const def = decorDef(k);
            return row('sellAsk', 'decor:' + k, d.tiers ? fi(def.draw, def.w, def.h) : (paper ? sprImg('brilho') : sprImg('coracao')), def.name || d.name, 'vender +' + Math.floor((d.tiers ? def.price : d.price) / 2), 'danger');
          }
          if (d.tiers){
            const tier = owned ? decorTier(k) : -1;
            const star = d.use ? '<img class="star" alt="interativo" src="' + sprURL('estrela', {w:'#ffd23f'}) + '">' : '';
            const evTxt = d.event ? ' · ' + (ev && ev.id === d.event ? ev.name : 'evento') : '';
            const nm = i => d.tiers[i].name + evTxt + star;
            let rows = '';
            if (tier < 0) rows += row('buy', 'decor:' + k + ':0', fi(d.tiers[0].draw, d.tiers[0].w, d.tiers[0].h), nm(0), d.tiers[0].price + '', '');
            if (tier === 0) rows += row('none', k, fi(d.tiers[0].draw, d.tiers[0].w, d.tiers[0].h), nm(0), inRoomTxt, 'owned');
            if (tier < 1) rows += row('buy', 'decor:' + k + ':1', fi(d.tiers[1].draw, d.tiers[1].w, d.tiers[1].h), nm(1), d.tiers[1].price + '', '');
            else rows += row('none', k, fi(d.tiers[1].draw, d.tiers[1].w, d.tiers[1].h), nm(1), inRoomTxt, 'owned');
            return rows;
          }
          const icon = paper ? sprImg('brilho') : d.kind === 'rug' ? sprImg('coracao') : d.draw ? fi(d.draw, d.w, d.h) : sprImg(d.spr || k);
          const meta = owned ? (paper ? (S.paper === k ? 'usando' : 'usar') : inRoomTxt) : d.price + '';
          return row(owned ? (paper ? 'paper' : 'none') : 'buy', owned ? k : 'decor:' + k, icon, d.name, meta, owned ? 'owned' : '');
        }).join('');
      }
    } else if (tab === 'skin'){
      const groups = [['natural', 'Cores naturais'], ['bicolor', 'Bicolores'], ['color', 'Coloridos']];
      for (const [g, title] of groups){
        list += '<h3>' + title + '</h3>';
        list += Object.keys(SKINS).filter(k => (SKINS[k].group || 'natural') === g).map(k => {
          const owned = S.skins.includes(k), on = S.skin === k, sk = SKINS[k];
          const sw = sk.hood ? '<span class="ico" style="background:linear-gradient(135deg,' + sk.hood + ' 50%,' + sk.fur + ' 50%);border:2px solid #3a2a4a;border-radius:50%"></span>' : swatch(sk.fur);
          if (sellMode) return owned && k !== 'bege' ? row('sellAsk', 'skin:' + k, sw, sk.name, 'vender +' + Math.floor(sk.price / 2), 'danger') : '';
          return row(owned ? 'skin' : 'buy', owned ? k : 'skin:' + k, sw, sk.name, owned ? (on ? 'usando' : 'usar') : sk.price + '', owned ? 'owned' : '');
        }).join('');
      }
    }
    const h = '<div class="panel">' +
      '<div style="display:flex;justify-content:space-between;align-items:center"><h2>Loja</h2>' +
      '<div class="coins"><img alt="moedas" src="' + sprURL('moeda') + '">' + S.coins + '</div>' +
      (tab !== 'food' ? '<button class="sellmode ' + (sellMode ? 'on' : '') + '" data-act="sellToggle">' + (sellMode ? 'VENDENDO' : 'VENDER') + '</button>' : '') + '</div>' +
      (sellMode && tab !== 'food' ? '<p class="sub">Toque num item seu para vender pela metade do preço.</p>' : '') +
      '<div class="tabs">' + tabs.map(t => '<button class="tab ' + (t[0] === tab ? 'on' : '') + '" data-act="tab" data-arg="' + t[0] + '">' + t[1] + '</button>').join('') + '</div>' +
      '<div class="list">' + list + '</div>' +
      '<button class="opt center" data-act="back">Voltar</button></div>';
    open('shop', h, {
      tab:t => { SFX.play('blip'); shop(t); },
      buy:arg => {
        const [cat, key, tier] = arg.split(':');
        const r = buy(cat, key, tier != null ? parseInt(tier, 10) : undefined);
        SFX.play(r.ok ? 'buy' : 'no');
        toast(r.msg, 1400);
        if (r.ok){ shop(tab); if (cat === 'furn' || cat === 'decor'){ const room = ROOMS.findIndex(x => x.id === (cat === 'furn' ? FURN[key].room : DECOR[key].room)); if (room >= 0 && room !== SCENE.room) goRoom(room); } }
      },
      sellToggle:() => { sellMode = !sellMode; SFX.play('blip'); shop(tab); },
      sellAsk:arg => {
        const [cat, key] = arg.split(':');
        const nm = cat === 'hat' ? HATS[key].name : cat === 'outfit' ? OUTFITS[key].name : cat === 'skin' ? SKINS[key].name : cat === 'furn' ? FURN[key].tiers[1].name : (decorDef(key).name || DECOR[key].name);
        confirm('Vender ' + nm + '?', () => { const r = sell(cat, key); SFX.play(r.ok ? 'coin' : 'no'); toast(r.msg || 'Não deu.', 1500); shop(tab); }, () => shop(tab));
      },
      wearHat:k => { S.hat = k || ''; save(); SFX.play('ok'); shop(tab); },
      wearOutfit:k => { S.outfit = k || ''; save(); SFX.play('ok'); shop(tab); },
      skin:k => { S.skin = k; save(); SFX.play('ok'); shop(tab); },
      paper:k => { S.paper = k; save(); SFX.play('ok'); shop(tab); },
      none:() => { SFX.play('blip'); },
      back:() => { SFX.play('back'); close(); }
    });
    const idx = items().findIndex(x => x.classList.contains('opt'));
    if (idx >= 0) setFocus(idx);
  }

    open('settings', h, {
      sound:() => { S.sound = !S.sound; SFX.on = S.sound; save(); SFX.play('ok'); settings(hooks); },
      export:() => exportPanel(hooks),

  function exportPanel(hooks){
    const code = exportCode();
    const h = '<div class="panel"><h2>Código do save</h2>' +
      '<p class="sub">Guarde este código para recuperar o ratinho em outro aparelho.</p>' +

      '<button class="opt center" data-act="copy">Copiar código</button>' +

    open('export', h, {

        const ta = document.getElementById('saveCode');

        }
        SFX.play(ok ? 'ok' : 'no');
        toast(ok ? 'Copiado!' : 'Selecione o texto e copie.', 1600);
      },
      file:async () => {

        try {
          const file = new File([code], name, {type:'text/plain'});

          SFX.play('ok'); toast('Arquivo salvo.', 1600);
        } catch (e) { SFX.play('no'); toast('Não deu para salvar o arquivo. Use o código.', 1800); }

    }, () => settings(hooks));
  }
  function importPanel(hooks){
    const h = '<div class="panel"><h2>Carregar código</h2>' +
      '<p class="sub">Cole o código aqui, ou escolha o arquivo de backup. Isso substitui o ratinho atual.</p>' +

      '<button class="opt center" data-act="load">Carregar código</button>' +
      '<label class="opt center" for="loadFile">Escolher arquivo de backup<input type="file" id="loadFile" accept=".txt,text/plain" style="display:none"></label>' +
      '<button class="opt center" data-act="back" style="margin-top:auto">Voltar</button></div>';
    open('import', h, {
      load:() => {
        const v = document.getElementById('loadCode').value;
        if (importCode(v)){ SFX.play('happy'); close(); hooks.loaded(); toast('Bem-vindo de volta, ' + S.name + '!'); }
        else { SFX.play('no'); toast('Código inválido.', 1600); }
      },
      back:() => settings(hooks)
    }, () => settings(hooks));
    const inp = document.getElementById('loadFile');
    if (inp) inp.addEventListener('change', () => {

  }
  function aboutPanel(hooks){

      '<p>Tem um rato aqui é um bichinho virtual: cuide da fome, do sono, da higiene e da diversão do seu rato.</p>' +

      '<p>Cuidar dele dá experiência: comer, banho, carinho, brinquedos e mini-jogos. Ele vira adolescente no nível ' + STAGES.young.level + ' e adulto no nível ' + STAGES.adult.level + '. A forma adulta depende de como você cuidou dele quando adolescente.</p>' +
      '<p>As barras caem mesmo com o app fechado. Entrando umas 3 vezes por dia dá para manter tudo em dia. Se ficar muito tempo sem cuidar, ele fica doente e triste, mas nunca vai embora.</p>' +

  function confirm(msg, yes, no){
    const h = '<div class="panel short"><h2>Tem certeza?</h2><p>' + esc(msg) + '</p>' +
      '<div class="row" style="margin-top:auto"><button class="opt" data-act="no">Não</button><button class="opt danger" data-act="yes">Sim</button></div></div>';
