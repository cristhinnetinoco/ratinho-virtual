  return {open, close, isOpen, current, button, toast, title, intro, nameForm, foodMenu, playMenu, status, shop, settings,
          confirm, evolved, result, gameIntro, hud, hint, dpad, quitButton, clearGameUI, setFocus, topbar, hideTop, nav, hideNav};
})();

/* ===== Mini-jogos (usam W e H da tela, definidos em scene.js) ===== */
const GAMES = (() => {
  const list = [
    {id:'pulo',      name:'Pulo Espacial',      icon:'nuvem',    how:'Pule de plataforma em plataforma até chegar no espaço! Toque e segure na metade esquerda ou direita da tela para se mover.'},
    {id:'corrida',   name:'Corrida na Cozinha', icon:'ratoeira', how:'Toque na tela para pular as ratoeiras e o gato. Pegue os queijos. Vai ficando mais rápido!'},
    {id:'chuva',     name:'Chuva de Comida',    icon:'biscoito', how:'Arraste o dedo para mover o rato. Pegue a comida que cai e desvie das meias e dos sabonetes. Você tem 3 vidas.'},
    {id:'memoria',   name:'Jogo da Memória',    icon:'moeda',    how:'Vire as cartas e encontre os 8 pares. Quanto menos jogadas, mais moedas.'},
    {id:'labirinto', name:'Labirinto',          icon:'queijo',   how:'Leve o rato até o queijo antes do tempo acabar. Use as setas ou deslize o dedo. Ele corre até a próxima curva.'}
  ];
  let cur = null, curId = null, onEnd = null;
  const inp = {down:false, x:0, y:0, sx:0, sy:0, tap:false, swipe:null, btn:null};
  const F = dt => dt / 16.667;
  const ratOpts = face => ({stage:S.stage === 'adult' ? 'young' : S.stage, skin:S.skin, hat:S.hat, outfit:S.outfit, face, t:performance.now()});

  /* ---------- 1. Pulo Espacial ---------- */
  function Pulo(){
    const rat = {x:W / 2, y:H - 30, vy:-6.1}, plats = [], cheese = [];
    let cam = 0, score = 0, bonus = 0, over = false, hold = 0, holdDir = 0, space = false, topY = H - 20;
    const stars = []; for (let i = 0; i < 60; i++) stars.push([Math.random() * W, Math.random() * 1400]);
    const clouds = []; for (let i = 0; i < 14; i++) clouds.push([Math.random() * (W - 16), Math.random() * 900]);
    function gen(){
      while (topY > cam - H){
        topY -= 22 + Math.random() * 20;
        const w = 28, r = Math.random();
        plats.push({x:4 + Math.random() * (W - 8 - w), y:topY, w, type:r < 0.12 ? 'move' : r < 0.18 ? 'spring' : 'norm', dx:Math.random() < 0.5 ? -1 : 1});
        if (Math.random() < 0.2) cheese.push({x:8 + Math.random() * (W - 16), y:topY - 16, got:false});
      }
    }
    plats.push({x:Math.round(W / 2 - 40), y:H - 18, w:80, type:'norm', dx:1});
    rat.y = H - 18;
    gen();
    return {
      update(dt){
        if (over) return;
        const f = F(dt);
        let mx = 0;
        if (inp.down) mx = inp.x < W / 2 ? -1 : 1;
        if (inp.btn === 'A'){ hold = 220; holdDir = -1; } else if (inp.btn === 'C'){ hold = 220; holdDir = 1; }
        inp.btn = null;
        if (hold > 0){ mx = holdDir; hold -= dt; }
        rat.x += mx * 2.4 * f;
        if (rat.x < -6) rat.x = W + 6; if (rat.x > W + 6) rat.x = -6;
        rat.vy += 0.26 * f;
        const py = rat.y; rat.y += rat.vy * f;
        if (rat.vy > 0){
          for (const p of plats){
            if (rat.x + 5 > p.x && rat.x - 5 < p.x + p.w && py <= p.y + 1 && rat.y >= p.y){
              rat.y = p.y; rat.vy = p.type === 'spring' ? -10 : -6.1; SFX.play('jump'); break;
            }
          }
        }
        for (const p of plats) if (p.type === 'move'){ p.x += p.dx * 0.6 * f; if (p.x < 2 || p.x + p.w > W - 2) p.dx *= -1; }
        for (const c of cheese) if (!c.got && Math.abs(c.x - rat.x) < 9 && Math.abs(c.y - (rat.y - 10)) < 10){ c.got = true; bonus += 5; SFX.play('coin'); }
        const camLine = cam + H * 0.45;
        if (rat.y < camLine) cam = rat.y - H * 0.45;
        const h = Math.max(0, Math.floor(-cam));
        score = Math.floor(h / 5) + bonus;
        if (!space && h >= 1500){ space = true; bonus += 30; SFX.play('win'); UI.hint('ESPAÇO! +30', true); setTimeout(() => UI.hint(''), 1800); }
        gen();
        for (let i = plats.length - 1; i >= 0; i--) if (plats[i].y > cam + H + 20) plats.splice(i, 1);
        for (let i = cheese.length - 1; i >= 0; i--) if (cheese[i].y > cam + H + 20) cheese.splice(i, 1);
        if (rat.y > cam + H + 12){ over = true; SFX.play('hit'); }
        UI.hud('ALT ' + h + 'm', 'PTS ' + score, h > 500);
      },
      draw(ctx){
        const h = Math.max(0, -cam);
        const band = h < 500 ? 0 : h < 1000 ? 1 : h < 1500 ? 2 : 3;
        const bg = ['#f1d7c2', '#9ad4f5', '#7a5fa8', '#1b1233'][band];
        rect(ctx, 0, 0, W, H, bg);
        if (band === 0){
          for (let y = -((cam * 0.5) % 10); y < H; y += 10) for (let x = 0; x < W; x += 10) px(ctx, x + 2, y, '#e8c3ab');
        } else if (band < 3){
          for (const c of clouds){ const y = ((c[1] - cam * 0.4) % 1000 + 1000) % 1000 - 100; if (y > -10 && y < H) drawSpr(ctx, 'nuvem', c[0], y, {alpha:band === 2 ? 0.5 : 0.9}); }
        } else {
          for (const s of stars){ const y = ((s[1] - cam * 0.3) % 1400 + 1400) % 1400 - 100; if (y > 0 && y < H) px(ctx, s[0], y, PAL.w); }
          fillEllipse(ctx, W - 30, 40 - (h - 1500) * 0.02, 12, 12, '#fff3b0'); fillEllipse(ctx, W - 35, 36 - (h - 1500) * 0.02, 4, 4, '#e6d58e');
        }
        for (const p of plats){
          const y = p.y - cam;
          box(ctx, p.x, y, p.w, 5, p.type === 'move' ? PAL.b : PAL.e, PAL.k);
          if (p.type === 'spring') drawSpr(ctx, 'mola', p.x + p.w / 2 - 4, y - 5);
        }
        for (const c of cheese) if (!c.got) drawSpr(ctx, 'queijo', c.x - 4, c.y - cam - 4);
        drawRat(ctx, rat.x, rat.y - cam, ratOpts(rat.vy < 0 ? 'happy' : 'wow'));
      },
      over:() => over,
      result(){ return {score, coins:Math.min(45, Math.floor(score / 6) + (space ? 10 : 0))}; }
    };
  }

  /* ---------- 2. Corrida na Cozinha ---------- */
  function Corrida(){
    const GY = H - 52, RX = Math.round(W * 0.3);
    const rat = {y:GY, vy:0, ground:true};
    let speed = 2.0, dist = 0, over = false, nextObs = 60, obs = [], cheese = [], score = 0, wob = 0;
    return {
      update(dt){
        if (over) return;
        const f = F(dt);
        if ((inp.tap || inp.btn) && rat.ground){ rat.vy = -5.8; rat.ground = false; SFX.play('jump'); }
        inp.tap = false; inp.btn = null;
        rat.vy += 0.3 * f; rat.y += rat.vy * f;
        if (rat.y >= GY){ rat.y = GY; rat.vy = 0; rat.ground = true; }
        speed += 0.00025 * dt;
        dist += speed * f; wob += dt;
        nextObs -= speed * f;
        if (nextObs <= 0){
          const r = Math.random();
          obs.push({x:W + 10, type:r < 0.7 ? 'trap' : 'cat'});
          if (Math.random() < 0.6) cheese.push({x:W + 40 + Math.random() * 30, y:GY - 24 - Math.random() * 14, got:false});
          nextObs = 70 + Math.random() * 60;
        }
        for (const o of obs) o.x -= speed * f;
        for (const c of cheese) c.x -= speed * f;
        obs = obs.filter(o => o.x > -20); cheese = cheese.filter(c => c.x > -10);
        for (const o of obs){
          const ow = o.type === 'trap' ? 12 : 16, oh = o.type === 'trap' ? 6 : 11;
          if (RX + 5 > o.x + 1 && RX - 5 < o.x + ow - 1 && rat.y > GY - oh + 1){ over = true; SFX.play('hit'); }
        }
        for (const c of cheese) if (!c.got && Math.abs(c.x - RX) < 9 && Math.abs(c.y - (rat.y - 10)) < 12){ c.got = true; score += 5; SFX.play('coin'); }
        UI.hud('PTS ' + (Math.floor(dist / 10) + score), 'x' + speed.toFixed(1));
      },
      draw(ctx){
        rect(ctx, 0, 0, W, H, '#fbeed6');
        const off = Math.floor(dist) % 16;
        for (let x = -off; x < W; x += 16){ rect(ctx, x, 30, 1, GY - 40, '#f0dcc0'); }
        rect(ctx, 0, GY - 62, W, 2, '#d9b98a');
        for (let x = -((Math.floor(dist * 1.5)) % 60); x < W; x += 60){ box(ctx, x + 6, GY - 88, 26, 20, '#bfe6ff', PAL.k); rect(ctx, x + 18, GY - 87, 2, 18, PAL.k); rect(ctx, x + 7, GY - 79, 24, 2, PAL.k); }
        rect(ctx, 0, GY - 10, W, 10, '#e2c9a4');
        rect(ctx, 0, GY, W, H - GY, '#c8945c');
        for (let x = -(Math.floor(dist) % 24); x < W; x += 24){ rect(ctx, x, GY, 12, 4, '#b8834c'); rect(ctx, x + 12, GY + 4, 12, 4, '#b8834c'); }
        for (const c of cheese) if (!c.got) drawSpr(ctx, 'queijo', c.x - 4, c.y - 4);
        for (const o of obs){ if (o.type === 'trap') drawSpr(ctx, 'ratoeira', o.x, GY - 6); else drawSpr(ctx, 'gato', o.x, GY - 11); }
        drawRat(ctx, RX, rat.y + (rat.ground ? (Math.floor(wob / 90) % 2) : 0), ratOpts(over ? 'sad' : rat.ground ? 'normal' : 'happy'));
      },
      over:() => over,
      result(){ const s = Math.floor(dist / 10) + score; return {score:s, coins:Math.min(45, Math.floor(s / 8))}; }
    };
  }

  /* ---------- 3. Chuva de Comida ---------- */
  function Chuva(){
    const GOOD = [['queijo', 3], ['biscoito', 2], ['semente', 1], ['morango', 2], ['bolo', 4], ['pizza', 4], ['uva', 2], ['pao', 2], ['brigadeiro', 3]];
    const BAD = ['meia', 'sabonete'];
    const FY = H - 40;
    let x = W / 2, tx = W / 2, lives = 3, score = 0, items = [], spawn = 0, gap = 900, over = false, t = 0, flash = 0;
    return {
      update(dt){
        if (over) return;
        t += dt; flash = Math.max(0, flash - dt);
        if (inp.down) tx = inp.x;
        if (inp.btn === 'A') tx -= 24; if (inp.btn === 'C') tx += 24; inp.btn = null; inp.tap = false;
        tx = Math.max(10, Math.min(W - 10, tx));
        x += (tx - x) * Math.min(1, dt / 90);
        spawn -= dt;
        if (spawn <= 0){
          const bad = Math.random() < 0.28;
          const g = GOOD[Math.floor(Math.random() * GOOD.length)];
          items.push({x:8 + Math.random() * (W - 16), y:14, kind:bad ? BAD[Math.floor(Math.random() * 2)] : g[0], val:bad ? 0 : g[1], bad, vy:1.4 + Math.random() * 0.9 + t / 60000});
          gap = Math.max(380, 900 - t / 80); spawn = gap;
        }
        for (const it of items){
          it.y += it.vy * F(dt);
          if (!it.hit && it.y > FY - 22 && it.y < FY - 2 && Math.abs(it.x - x) < 11){
            it.hit = true;
            if (it.bad){ lives--; flash = 400; SFX.play('hit'); if (lives <= 0) over = true; }
            else { score += it.val; SFX.play('coin'); }
          }
        }
        items = items.filter(it => !it.hit && it.y < H + 8);
        UI.hud('PTS ' + score, '♥'.repeat(lives) + '♡'.repeat(3 - lives));
      },
      draw(ctx){
        rect(ctx, 0, 0, W, H, flash > 0 ? '#ffd9d3' : '#f1d7c2');
        for (let y = 16; y < FY - 8; y += 10) for (let xx = (Math.floor(y / 10) % 2) ? 5 : 0; xx < W; xx += 10) px(ctx, xx + 2, y, '#e8c3ab');
        rect(ctx, 0, 0, W, 12, '#d9b98a'); rect(ctx, 0, 12, W, 2, PAL.k);
        for (let xx = 0; xx < W; xx += 24) rect(ctx, xx + 11, 0, 2, 12, '#b8955f');
        rect(ctx, 0, FY, W, H - FY, '#c8945c'); rect(ctx, 0, FY, W, 2, '#b8834c');
        for (const it of items) drawSpr(ctx, it.kind, it.x - 4, it.y - 4);
        drawRat(ctx, x, FY, ratOpts(flash > 0 ? 'sad' : 'wow'));
      },
      over:() => over,
      result(){ return {score, coins:Math.min(45, Math.floor(score / 2))}; }
    };
  }

  /* ---------- 4. Jogo da Memoria ---------- */
  function Memoria(){
    const icons = ['queijo', 'semente', 'biscoito', 'morango', 'bolo', 'sopa', 'coracao', 'moeda'];
    const deck = icons.concat(icons).map(ic => ({ic, up:false, done:false}));
    for (let i = deck.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
    const GAP = 4, CS = Math.min(44, Math.floor((W - 24 - 3 * GAP) / 4));
    const X0 = Math.floor((W - (4 * CS + 3 * GAP)) / 2), Y0 = Math.max(26, Math.floor((H - (4 * CS + 3 * GAP)) / 2));
    let first = -1, second = -1, lock = 0, moves = 0, over = false, cursor = 0, done = 0;
    function flip(i){
      const c = deck[i];
      if (lock > 0 || c.up || c.done) return;
      c.up = true; SFX.play('flip');
      if (first < 0){ first = i; return; }
      second = i; moves++;
      if (deck[first].ic === deck[second].ic){ deck[first].done = deck[second].done = true; done += 2; first = second = -1; SFX.play('coin'); if (done >= 16){ over = true; SFX.play('win'); } }
      else lock = 750;
    }
    return {
      update(dt){
        if (over) return;
        if (lock > 0){ lock -= dt; if (lock <= 0){ deck[first].up = deck[second].up = false; first = second = -1; } }
        if (inp.tap){
          inp.tap = false;
          const cx = Math.floor((inp.sx - X0) / (CS + GAP)), cy = Math.floor((inp.sy - Y0) / (CS + GAP));
          if (cx >= 0 && cx < 4 && cy >= 0 && cy < 4){ cursor = cy * 4 + cx; flip(cursor); }
        }
        if (inp.btn === 'A'){ cursor = (cursor + 1) % 16; SFX.play('blip'); }
        else if (inp.btn === 'B'){ flip(cursor); }
        inp.btn = null;
        UI.hud('JOGADAS ' + moves, 'PARES ' + (done / 2) + '/8');
      },
      draw(ctx){
        rect(ctx, 0, 0, W, H, '#6b5a86');
        for (let y = 0; y < H; y += 8) for (let x = (Math.floor(y / 8) % 2) ? 4 : 0; x < W; x += 8) px(ctx, x, y, '#7a69a0');
        const half = Math.floor(CS / 2);
        deck.forEach((c, i) => {
          const x = X0 + (i % 4) * (CS + GAP), y = Y0 + Math.floor(i / 4) * (CS + GAP);
          if (c.done){ box(ctx, x, y, CS, CS, '#e4f4ee', '#3fb7a0'); drawSpr(ctx, c.ic, x + half - 4, y + half - 4, {alpha:0.55}); }
          else if (c.up){ box(ctx, x, y, CS, CS, PAL.w, PAL.k); drawSpr(ctx, c.ic, x + half - 4, y + half - 4); }
          else {
            box(ctx, x, y, CS, CS, '#e05a4e', PAL.k);
            box(ctx, x + 3, y + 3, CS - 6, CS - 6, '#f5943c', '#a63b33');
            drawSpr(ctx, 'estrela', x + half - 2, y + half - 2, {remap:{w:'#ffd23f'}});
          }
          if (i === cursor){ rect(ctx, x - 2, y - 2, CS + 4, 2, PAL.y); rect(ctx, x - 2, y + CS, CS + 4, 2, PAL.y); rect(ctx, x - 2, y, 2, CS, PAL.y); rect(ctx, x + CS, y, 2, CS, PAL.y); }
        });
      },
      over:() => over,
      result(){ const score = Math.max(0, 100 - moves * 4); return {score, coins:Math.min(40, Math.max(4, Math.floor(score / 3)))}; }
    };
  }

  /* ---------- 5. Labirinto ---------- */
  function Labirinto(){
    const CS = 14, OY = 24, padH = Math.ceil(H * 0.22);
    const COLS = Math.max(7, Math.floor((W - 8) / CS)), ROWS = Math.max(7, Math.floor((H - OY - padH - 8) / CS));
    const OX = Math.floor((W - COLS * CS) / 2);
    const cells = [];
    for (let r = 0; r < ROWS; r++){ cells.push([]); for (let c = 0; c < COLS; c++) cells[r].push({n:true, e:true, s:true, w:true, v:false}); }
    const stack = [[0, 0]]; cells[0][0].v = true;
    const D = {n:[0, -1, 's'], s:[0, 1, 'n'], e:[1, 0, 'w'], w:[-1, 0, 'e']};
    while (stack.length){
      const [c, r] = stack[stack.length - 1];
      const opts = Object.keys(D).filter(k => { const nc = c + D[k][0], nr = r + D[k][1]; return nc >= 0 && nc < COLS && nr >= 0 && nr < ROWS && !cells[nr][nc].v; });
      if (!opts.length){ stack.pop(); continue; }
      const k = opts[Math.floor(Math.random() * opts.length)];
      const nc = c + D[k][0], nr = r + D[k][1];
      cells[r][c][k] = false; cells[nr][nc][D[k][2]] = false; cells[nr][nc].v = true;
      stack.push([nc, nr]);
    }
    const rat = {c:0, r:0, x:0, y:0, tc:0, tr:0, moving:false};
    let timeLeft = Math.max(45, Math.round(COLS * ROWS * 0.3)) * 1000, over = false, won = false, dir = 'e';
    const openings = (c, r) => ['n', 'e', 's', 'w'].filter(k => !cells[r][c][k]).length;
    function go(k){
      if (rat.moving || over) return;
      let c = rat.c, r = rat.r, steps = 0;
      while (!cells[r][c][k]){
        c += D[k][0]; r += D[k][1]; steps++;
        if (openings(c, r) !== 2) break;
        if (c === COLS - 1 && r === ROWS - 1) break;
      }
      if (!steps){ SFX.play('no'); return; }
      rat.tc = c; rat.tr = r; rat.moving = true; dir = k; SFX.play('blip');
    }
    UI.dpad(go);
    return {
      update(dt){
        if (over) return;
        timeLeft -= dt;
        if (inp.swipe){ go(inp.swipe); inp.swipe = null; }
        if (inp.btn === 'A'){ go('w'); } else if (inp.btn === 'C'){ go('e'); } else if (inp.btn === 'B'){ go(dir === 'n' ? 's' : 'n'); }
        inp.btn = null; inp.tap = false;
        if (rat.moving){
          const txp = rat.tc * CS, typ = rat.tr * CS, sp = 0.1 * dt;
          rat.x += Math.max(-sp, Math.min(sp, txp - rat.x)); rat.y += Math.max(-sp, Math.min(sp, typ - rat.y));
          if (Math.abs(rat.x - txp) < 0.01 && Math.abs(rat.y - typ) < 0.01){ rat.c = rat.tc; rat.r = rat.tr; rat.x = txp; rat.y = typ; rat.moving = false;
            if (rat.c === COLS - 1 && rat.r === ROWS - 1){ over = true; won = true; SFX.play('win'); } }
        }
        if (timeLeft <= 0){ timeLeft = 0; over = true; SFX.play('sad'); }
        UI.hud('TEMPO ' + Math.ceil(timeLeft / 1000), '');
      },
      draw(ctx){
        rect(ctx, 0, 0, W, H, '#c8945c');
        rect(ctx, OX - 2, OY - 2, COLS * CS + 4, ROWS * CS + 4, PAL.k);
        rect(ctx, OX, OY, COLS * CS, ROWS * CS, '#f1d7c2');
        for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++){
          const x = OX + c * CS, y = OY + r * CS, w = cells[r][c];
          if (w.n) rect(ctx, x, y, CS + 1, 2, PAL.k);
          if (w.w) rect(ctx, x, y, 2, CS + 1, PAL.k);
          if (w.s) rect(ctx, x, y + CS - 1, CS + 1, 2, PAL.k);
          if (w.e) rect(ctx, x + CS - 1, y, 2, CS + 1, PAL.k);
        }
        drawSpr(ctx, 'queijo', OX + (COLS - 1) * CS + 3, OY + (ROWS - 1) * CS + 3);
        const hx = OX + rat.x + 7, hy = OY + rat.y + 11;
        oEllipse(ctx, hx, hy - 4, 4, 3, SKINS[S.skin] ? SKINS[S.skin].fur : PAL.c, PAL.k);
        oEllipse(ctx, hx - 3, hy - 7, 1, 1, PAL.p, PAL.k); oEllipse(ctx, hx + 3, hy - 7, 1, 1, PAL.p, PAL.k);
        px(ctx, hx - 2, hy - 5, PAL.k); px(ctx, hx + 1, hy - 5, PAL.k); px(ctx, hx, hy - 3, PAL.P);
      },
      over:() => over,
      result(){ const s = won ? Math.ceil(timeLeft / 1000) : 0; return {score:s, coins:won ? Math.min(30, 10 + Math.floor(s / 3)) : 3}; }
    };
  }

  const makers = {pulo:Pulo, corrida:Corrida, chuva:Chuva, memoria:Memoria, labirinto:Labirinto};
  let endTimer = 0;
  function register(def, maker){ list.push(def); makers[def.id] = maker; }

  function begin(){
    inp.down = false; inp.tap = false; inp.swipe = null; inp.btn = null;
    UI.clearGameUI();
    cur = makers[curId](); endTimer = 0;
    UI.quitButton(() => { SFX.play('back'); quit(); onEnd && onEnd(false); });
  }
  function start(id, done){
    const g = list.find(x => x.id === id);
    onEnd = done; curId = id;
    UI.gameIntro(g, () => { SFX.play('ok'); begin(); }, () => { onEnd && onEnd(false); });
  }
  function active(){ return !!cur; }
  function update(dt){
    if (!cur) return;
    cur.update(dt);
    if (cur.over()){
      endTimer += dt;
      if (endTimer > 900){
        const g = list.find(x => x.id === curId);
        const r = cur.result();
        const isBest = r.score > 0 && (!S.best[curId] || r.score > S.best[curId]);
        finishGame(curId, r.score, r.coins);
        cur = null; UI.clearGameUI();
        SFX.play('happy');
        UI.result(g, r.score, r.coins, isBest, () => { onEnd && onEnd(true); }, () => { SFX.play('ok'); begin(); });
      }
    }
  }
  function draw(ctx){ if (cur) cur.draw(ctx); }
  function pointer(type, x, y){
    if (!cur) return;
    if (type === 'down'){ inp.down = true; inp.x = x; inp.y = y; inp.sx = x; inp.sy = y; inp.tap = true; }
    else if (type === 'move'){ inp.x = x; inp.y = y; }
    else {
      inp.down = false; inp.x = x; inp.y = y;
      const dx = x - inp.sx, dy = y - inp.sy;
      if (Math.abs(dx) > 14 || Math.abs(dy) > 14) inp.swipe = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'e' : 'w') : (dy > 0 ? 's' : 'n');
    }
  }
  function button(k){ if (!cur) return false; inp.btn = k; return true; }
  function quit(){ cur = null; UI.clearGameUI(); }
  return {list, start, active, update, draw, pointer, button, quit, register, inp, F, ratOpts};
})();

/* ===== Mini-jogos, parte 2 ===== */
(() => {
  const inp = GAMES.inp, F = GAMES.F, ratOpts = GAMES.ratOpts;

  function bgTiles(ctx, wall, line, floorA, floorB, floorY){
    rect(ctx, 0, 0, W, H, wall);
    for (let y = 10; y < floorY - 2; y += 12) rect(ctx, 0, y, W, 1, line);
    for (let x = 8; x < W; x += 16) rect(ctx, x, 0, 1, floorY, line);
    for (let y = floorY; y < H; y += 10) for (let x = 0; x < W; x += 10)
      rect(ctx, x, y, 10, Math.min(10, H - y), ((x / 10 + (y - floorY) / 10) % 2) ? floorA : floorB);
  }

  /* ---------- Torre de queijos ---------- */
  function Torre(){
    const BH = 9, baseY = H - 34;
    const blocks = [{x:Math.round(W / 2 - 22), w:44}];
    let cur = {x:0, w:44, dir:1}, speed = 1.3, over = false, score = 0, cam = 0, perfect = 0, flashT = 0;
    const levelTop = i => baseY - (i + 1) * BH;
    function cheese(ctx, x, y, w, h, ghost){
      box(ctx, x, y, w, h, ghost ? '#ffe680' : PAL.y, PAL.k);
      rect(ctx, x + 1, y + 1, w - 2, 1, '#fff3b0');
      for (let i = x + 3; i < x + w - 3; i += 7){ px(ctx, i, y + 3, PAL.Y); px(ctx, i + 1, y + 3, PAL.Y); px(ctx, i + 3, y + 6, PAL.Y); }
    }
    return {
      update(dt){
        if (over) return;
        const f = F(dt);
        cur.x += cur.dir * speed * f;
        if (cur.x <= 0){ cur.x = 0; cur.dir = 1; }
        if (cur.x + cur.w >= W){ cur.x = W - cur.w; cur.dir = -1; }
        if (inp.tap || inp.btn){
          inp.tap = false; inp.btn = null;
          const last = blocks[blocks.length - 1];
          const x0 = Math.max(cur.x, last.x), x1 = Math.min(cur.x + cur.w, last.x + last.w);
          const ov = x1 - x0;
          if (ov <= 1){ over = true; SFX.play('hit'); }
          else {
            if (Math.abs(cur.x - last.x) <= 1.5){ blocks.push({x:last.x, w:last.w}); perfect++; score += 2; flashT = 500; SFX.play('coin'); }
            else { blocks.push({x:Math.round(x0), w:Math.round(ov)}); score += 1; SFX.play('ok'); }
            const nw = blocks[blocks.length - 1].w;
            cur = {x:cur.dir > 0 ? 0 : W - nw, w:nw, dir:cur.dir};
            speed = Math.min(4.6, speed + 0.13);
          }
        }
        flashT = Math.max(0, flashT - dt);
        const want = Math.min(0, levelTop(blocks.length) - H * 0.4);
        cam += (want - cam) * Math.min(1, dt / 150);
        UI.hud('ALTURA ' + (blocks.length - 1), 'PERFEITO ' + perfect);
        UI.hint(flashT > 0 ? 'PERFEITO!' : '');
      },
      draw(ctx){
        rect(ctx, 0, 0, W, H, '#e8f0d6');
        for (let y = 6 - ((cam * 0.5) % 12); y < H; y += 12) rect(ctx, 0, y, W, 1, '#d5e3c6');
        rect(ctx, 0, baseY - cam, W, H, '#c8945c'); rect(ctx, 0, baseY - cam, W, 3, '#b8834c');
        for (let i = 0; i < blocks.length; i++){ const b = blocks[i]; cheese(ctx, b.x, levelTop(i) - cam, b.w, BH); }
        if (!over) cheese(ctx, cur.x, levelTop(blocks.length) - cam, cur.w, BH, true);
        drawRat(ctx, 16, baseY - cam, ratOpts(over ? 'sad' : flashT > 0 ? 'happy' : 'wow'));
      },
      over:() => over,
      result(){ return {score, coins:Math.min(45, score * 2)}; }
    };
  }

  /* ---------- Danca do rato ---------- */
  function Danca(){
    const BEAT = 500, LX = i => Math.round(W * (i + 0.5) / 3), HIT = H - 64, FALL = 1500, total = 64;
    const cols = ['#e05a4e', '#ffd23f', '#3fb7a0'], freqs = [523, 659, 784];
    const notes = [];
    for (let b = 4; b < total; b++){
      if (Math.random() < 0.7) notes.push({lane:Math.floor(Math.random() * 3), t:b * BEAT});
      if (Math.random() < 0.15) notes.push({lane:Math.floor(Math.random() * 3), t:b * BEAT + BEAT / 2});
    }
    notes.sort((a, b) => a.t - b.t);
    const endT = total * BEAT + 800;
    let t = 0, score = 0, combo = 0, best = 0, misses = 0, over = false, fb = '', fbT = 0, lastLane = 1, flash = 0;
    function hitLane(l){
      let bestN = null, bd = 1e9;
      for (const n of notes){ if (n.done || n.missed || n.lane !== l) continue; const d = Math.abs(n.t - t); if (d < bd){ bd = d; bestN = n; } }
      if (bestN && bd <= 170){
        bestN.done = true; const p = bd <= 80; score += p ? 3 : 1; combo++; best = Math.max(best, combo);
        fb = p ? 'PERFEITO' : 'BOM'; fbT = 350; SFX.note(freqs[l], 0.16); lastLane = l; flash = 200;
      } else { combo = 0; fb = 'ERROU'; fbT = 350; SFX.play('no'); }
    }
    return {
      update(dt){
        if (over) return;
        t += dt; fbT = Math.max(0, fbT - dt); flash = Math.max(0, flash - dt);
        if (inp.tap){ inp.tap = false; hitLane(Math.min(2, Math.floor(inp.sx / (W / 3)))); }
        if (inp.btn){ hitLane({A:0, B:1, C:2}[inp.btn] || 0); inp.btn = null; }
        for (const n of notes){ if (!n.done && !n.missed && t - n.t > 170){ n.missed = true; misses++; combo = 0; fb = 'PERDEU'; fbT = 300; } }
        if (misses >= 12){ over = true; SFX.play('sad'); }
        if (t > endT){ over = true; SFX.play('win'); }
        UI.hud('PTS ' + score, 'COMBO ' + combo, true);
        UI.hint(fbT > 0 ? fb : '', true);
      },
      draw(ctx){
        const beat = Math.floor(t / BEAT);
        rect(ctx, 0, 0, W, H, beat % 2 ? '#2a1c4d' : '#1b1233');
        const disco = ['#e05a4e', '#ffd23f', '#3fb7a0', '#5aa9e6'];
        for (let i = 0; i < 4; i++) rect(ctx, Math.round(i * W / 4), 0, Math.ceil(W / 4), 5, disco[(i + beat) % 4]);
        for (let i = 1; i < 3; i++) rect(ctx, Math.round(i * W / 3), 5, 1, HIT - 5, '#3a2a4a');
        rect(ctx, 0, HIT, W, 2, PAL.w);
        for (let i = 0; i < 3; i++) oEllipse(ctx, LX(i), HIT + 1, 8, 3, '#3a2a4a', cols[i]);
        for (const n of notes){
          if (n.done) continue;
          const y = HIT - (n.t - t) / FALL * HIT;
          if (y < -8 || y > H) continue;
          drawSpr(ctx, 'nota', LX(n.lane) - 4, y - 4, {remap:{k:n.missed ? PAL.G : cols[n.lane]}});
        }
        rect(ctx, 0, H - 26, W, 26, '#3a2a4a');
        const o = ratOpts(fb === 'ERROU' || fb === 'PERDEU' ? (fbT > 0 ? 'sad' : 'normal') : 'happy');
        o.flip = lastLane === 0;
        drawRat(ctx, W / 2 + (lastLane - 1) * 8, H - 8 - (flash > 0 ? 4 : 0), o);
      },
      over:() => over,
      result(){ return {score, coins:Math.min(45, Math.floor(score / 6))}; }
    };
  }

  /* ---------- Bolhas do banho ---------- */
  function Bolhas(){
    const DUR = 45000, FY = H - 30;
    let bubbles = [], pops = [], t = 0, score = 0, spawn = 0, over = false;
    return {
      update(dt){
        if (over) return;
        t += dt; spawn -= dt;
        if (spawn <= 0){
          const r = Math.random(), kind = r < 0.1 ? 'gold' : r < 0.2 ? 'dark' : 'norm';
          bubbles.push({x:14 + Math.random() * (W - 28), y:FY - 8, r:4 + Math.random() * 5, vy:0.5 + Math.random() * 0.8 + t / 45000, ph:Math.random() * 6.28, kind});
          spawn = Math.max(260, 700 - t / 100);
        }
        const f = F(dt);
        for (const b of bubbles){ b.y -= b.vy * f; b.x += Math.sin(t / 400 + b.ph) * 0.3 * f; }
        if (inp.tap){
          inp.tap = false;
          let hit = null;
          for (let i = bubbles.length - 1; i >= 0; i--){ const b = bubbles[i]; if (Math.hypot(b.x - inp.sx, b.y - inp.sy) <= b.r + 4){ hit = b; break; } }
          if (hit){
            hit.dead = true;
            const v = hit.kind === 'gold' ? 5 : hit.kind === 'dark' ? -3 : 1;
            score = Math.max(0, score + v);
            SFX.play(hit.kind === 'dark' ? 'no' : hit.kind === 'gold' ? 'coin' : 'flip');
            pops.push({x:hit.x, y:hit.y, r:hit.r, t:0, kind:hit.kind});
          }
        }
        inp.btn = null;
        bubbles = bubbles.filter(b => !b.dead && b.y > -12);
        for (const p of pops) p.t += dt;
        pops = pops.filter(p => p.t < 260);
        if (t >= DUR){ over = true; SFX.play('win'); }
        UI.hud('PTS ' + score, 'TEMPO ' + Math.ceil((DUR - t) / 1000));
      },
      draw(ctx){
        bgTiles(ctx, '#d6ecf3', '#b9d7e2', '#eaf6fa', '#bfd9e6', FY);
        const tx = Math.round(W / 2 - 26);
        box(ctx, tx, FY - 14, 52, 18, PAL.w, PAL.k); rect(ctx, tx + 2, FY - 11, 48, 6, '#9ad4f5');
        rect(ctx, tx + 3, FY + 4, 3, 3, PAL.Y); rect(ctx, tx + 46, FY + 4, 3, 3, PAL.Y);
        drawRat(ctx, W / 2, FY - 10, ratOpts(over ? 'happy' : 'wow'));
        for (const b of bubbles){
          const col = b.kind === 'gold' ? '#ffd23f' : b.kind === 'dark' ? '#6b5a86' : '#dff3ff';
          const oc = b.kind === 'gold' ? PAL.Y : b.kind === 'dark' ? PAL.k : '#5aa9e6';
          oEllipse(ctx, b.x, b.y, b.r, b.r, col, oc);
          px(ctx, b.x - Math.round(b.r / 2), b.y - Math.round(b.r / 2), PAL.w);
        }
        for (const p of pops){
          const k = p.t / 260, rr = p.r + k * 6;
          const c = p.kind === 'dark' ? PAL.k : '#5aa9e6';
          px(ctx, p.x - rr, p.y, c); px(ctx, p.x + rr, p.y, c); px(ctx, p.x, p.y - rr, c); px(ctx, p.x, p.y + rr, c);
          px(ctx, p.x - rr * 0.7, p.y - rr * 0.7, c); px(ctx, p.x + rr * 0.7, p.y - rr * 0.7, c); px(ctx, p.x - rr * 0.7, p.y + rr * 0.7, c); px(ctx, p.x + rr * 0.7, p.y + rr * 0.7, c);
        }
      },
      over:() => over,
      result(){ return {score, coins:Math.min(45, Math.floor(score / 3))}; }
    };
  }

  /* ---------- Canos da banheira ---------- */
  function Canos(){
    const COLS = 5, ROWS = 6, CS = Math.min(22, Math.floor((W - 10) / COLS));
    const OX = Math.floor((W - COLS * CS) / 2), OY = 40;
    const N = 1, E = 2, S_ = 4, W_ = 8;
    const seen = Array.from({length:ROWS}, () => Array(COLS).fill(false));
    const path = [];
    (function dfs(c, r){
      seen[r][c] = true; path.push([c, r]);
      if (c === COLS - 1 && r === ROWS - 1) return true;
      const dirs = [[1, 0], [0, 1], [-1, 0], [0, -1]].sort(() => Math.random() - 0.5);
      for (const [dc, dr] of dirs){
        const nc = c + dc, nr = r + dr;
        if (nc < 0 || nc >= COLS || nr < 0 || nr >= ROWS || seen[nr][nc]) continue;
        if (dfs(nc, nr)) return true;
      }
      path.pop(); return false;
    })(0, 0);
    const grid = Array.from({length:ROWS}, () => Array(COLS).fill(0));
    const dm = (dc, dr) => dc === 1 ? E : dc === -1 ? W_ : dr === 1 ? S_ : N;
    for (let i = 0; i < path.length; i++){
      const [c, r] = path[i]; let m = 0;
      if (i === 0) m |= N; else { const [pc, pr] = path[i - 1]; m |= dm(pc - c, pr - r); }
      if (i === path.length - 1) m |= S_; else { const [nc, nr] = path[i + 1]; m |= dm(nc - c, nr - r); }
      grid[r][c] = m;
    }
    const fillers = [N | S_, E | W_, N | E, E | S_, S_ | W_, W_ | N, N | E | S_, E | S_ | W_, N | S_ | W_, N | E | W_];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (!grid[r][c]) grid[r][c] = fillers[Math.floor(Math.random() * fillers.length)];
    const rot = m => ((m << 1) & 15) | ((m & 8) ? 1 : 0);
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++){ const k = Math.floor(Math.random() * 4); for (let i = 0; i < k; i++) grid[r][c] = rot(grid[r][c]); }
    let wet = null, won = false, over = false, timeLeft = 75000;
    function flood(){
      wet = Array.from({length:ROWS}, () => Array(COLS).fill(false));
      const q = [];
      if (grid[0][0] & N){ wet[0][0] = true; q.push([0, 0]); }
      while (q.length){
        const [c, r] = q.shift(), m = grid[r][c];
        const go = (dc, dr, out, inn) => {
          if (!(m & out)) return;
          const nc = c + dc, nr = r + dr;
          if (nc < 0 || nc >= COLS || nr < 0 || nr >= ROWS || wet[nr][nc] || !(grid[nr][nc] & inn)) return;
          wet[nr][nc] = true; q.push([nc, nr]);
        };
        go(1, 0, E, W_); go(-1, 0, W_, E); go(0, 1, S_, N); go(0, -1, N, S_);
      }
      return wet[ROWS - 1][COLS - 1] && !!(grid[ROWS - 1][COLS - 1] & S_);
    }
    if (flood()){ const [c, r] = path[Math.floor(path.length / 2)]; grid[r][c] = rot(grid[r][c]); flood(); }
    return {
      update(dt){
        if (over) return;
        timeLeft -= dt;
        if (inp.tap){
          inp.tap = false;
          const c = Math.floor((inp.sx - OX) / CS), r = Math.floor((inp.sy - OY) / CS);
          if (c >= 0 && c < COLS && r >= 0 && r < ROWS){
            grid[r][c] = rot(grid[r][c]); SFX.play('flip');
            if (flood()){ won = true; over = true; SFX.play('win'); }
          }
        }
        inp.btn = null;
        if (timeLeft <= 0){ timeLeft = 0; over = true; SFX.play('sad'); }
        UI.hud('AGUA ' + Math.ceil(timeLeft / 1000), '');
      },
      draw(ctx){
        bgTiles(ctx, '#d6ecf3', '#b9d7e2', '#eaf6fa', '#bfd9e6', OY + ROWS * CS + 4);
        box(ctx, OX + 2, OY - 16, CS - 4, 14, '#5aa9e6', PAL.k); rect(ctx, OX + 4, OY - 14, CS - 8, Math.max(1, Math.round((CS - 10) * timeLeft / 75000)), '#9ad4f5');
        const tubX = OX + (COLS - 1) * CS - 8, tubY = OY + ROWS * CS + 6;
        box(ctx, tubX, tubY, CS + 16, 12, PAL.w, PAL.k); rect(ctx, tubX + 2, tubY + 3, CS + 12, 3, won ? '#5aa9e6' : '#eaf6fa');
        const T = 6;
        for (let pass = 0; pass < 2; pass++){
          for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++){
            const x = OX + c * CS, y = OY + r * CS, m = grid[r][c];
            if (pass === 0) box(ctx, x, y, CS, CS, '#f6f9fb', '#b9d7e2');
            const w = wet && wet[r][c];
            const col = pass === 0 ? (w ? '#2f6bb0' : '#6b5a86') : (w ? '#5aa9e6' : '#c9c3d6');
            const th = pass === 0 ? T + 2 : T, o = Math.floor(th / 2);
            const cx = x + Math.floor(CS / 2), cy = y + Math.floor(CS / 2);
            rect(ctx, cx - o, cy - o, th, th, col);
            if (m & N) rect(ctx, cx - o, y, th, cy - y + o, col);
            if (m & S_) rect(ctx, cx - o, cy - o, th, y + CS - cy + o, col);
            if (m & W_) rect(ctx, x, cy - o, cx - x + o, th, col);
            if (m & E) rect(ctx, cx - o, cy - o, x + CS - cx + o, th, col);
          }
        }
        drawRat(ctx, 22, H - 8, ratOpts(over ? (won ? 'happy' : 'sad') : 'normal'));
      },
      over:() => over,
      result(){ const s = won ? Math.ceil(timeLeft / 1000) : 0; return {score:s, coins:won ? Math.min(30, 8 + Math.floor(s / 3)) : 3}; }
    };
  }

  /* ---------- Diz o guincho ---------- */
  function Guincho(){
    const cols = ['#e05a4e', '#5aa9e6', '#ffd23f', '#6ccf7a'], dark = ['#a63b33', '#2f6bb0', '#e0a500', '#3c9a4c'], freqs = [392, 523, 659, 784];
    const size = Math.min(W - 16, 110), half = Math.floor(size / 2), bx = Math.floor((W - size) / 2), by = Math.floor((H - size) / 2) + 6;
    const seq = [];
    let idx = 0, phase = 'show', showI = 0, showT = 0, lit = -1, over = false, score = 0, wait = 0;
    function addStep(){ seq.push(Math.floor(Math.random() * 4)); phase = 'show'; showI = 0; showT = -400; lit = -1; }
    function light(i){ lit = i; SFX.note(freqs[i], 0.25); }
    addStep();
    return {
      update(dt){
        if (over) return;
        if (phase === 'show'){
          showT += dt; inp.tap = false; inp.btn = null;
          if (lit < 0 && showT >= 0){ light(seq[showI]); showT = 0; }
          else if (lit >= 0 && showT > 450){ lit = -1; showT = -250; showI++; if (showI >= seq.length){ phase = 'input'; idx = 0; showT = 0; } }
        } else if (phase === 'input'){
          let pressed = -1;
          if (inp.tap){
            inp.tap = false;
            if (inp.sx >= bx && inp.sx < bx + size && inp.sy >= by && inp.sy < by + size) pressed = (inp.sy < by + half ? 0 : 2) + (inp.sx < bx + half ? 0 : 1);
          }
          if (inp.btn){ pressed = {A:0, B:1, C:2}[inp.btn]; inp.btn = null; }
          if (pressed >= 0){
            light(pressed); showT = 0;
            if (pressed === seq[idx]){ idx++; if (idx >= seq.length){ score = seq.length; phase = 'wait'; wait = 700; SFX.play('coin'); } }
            else { over = true; SFX.play('sad'); }
          } else { showT += dt; if (showT > 220) lit = -1; }
        } else {
          wait -= dt; lit = -1; if (wait <= 0) addStep();
        }
        UI.hud('SEQUENCIA ' + score, phase === 'input' ? 'SUA VEZ' : phase === 'show' ? 'OUÇA' : '');
      },
      draw(ctx){
        rect(ctx, 0, 0, W, H, '#f1d7c2');
        for (let y = 6; y < H; y += 10) for (let x = (Math.floor(y / 10) % 2) ? 5 : 0; x < W; x += 10) px(ctx, x + 2, y, '#e8c3ab');
        for (let i = 0; i < 4; i++){
          const x = bx + (i % 2) * half, y = by + Math.floor(i / 2) * half;
          box(ctx, x + 2, y + 2, half - 4, half - 4, lit === i ? cols[i] : dark[i], PAL.k);
          if (lit === i) rect(ctx, x + 5, y + 5, half - 10, 2, '#fffaf0');
        }
        drawRat(ctx, W / 2, by - 6, ratOpts(over ? 'sad' : lit >= 0 ? 'wow' : 'normal'));
      },
      over:() => over,
      result(){ return {score, coins:Math.min(40, score * 3)}; }
    };
  }

  /* ---------- Basquete de papel ---------- */
  function Basquete(){
    const FY = H - 30, start = {x:24, y:FY - 22};
    let balls = 10, score = 0, over = false, ball = null, wind = 0, bin = {x:0, y:0, w:20, h:18}, from = null, msg = '', msgT = 0;
    function newRound(){ wind = (Math.random() - 0.5) * 0.12; bin.x = Math.round(W * 0.45 + Math.random() * (W * 0.5 - bin.w)); bin.y = Math.round(H * 0.25 + Math.random() * H * 0.18); }
    newRound();
    return {
      update(dt){
        if (over) return;
        const f = F(dt); msgT = Math.max(0, msgT - dt);
        if (!ball){
          if (inp.down && !from) from = {x:inp.sx, y:inp.sy};
          if (from && !inp.down){
            const dx = inp.x - from.x, dy = inp.y - from.y; from = null;
            if (Math.hypot(dx, dy) > 12 && dy < 0){
              ball = {x:start.x, y:start.y, vx:Math.max(-6, Math.min(6, dx * 0.09)), vy:Math.max(-9, dy * 0.09), life:0, scored:false};
              SFX.play('jump'); balls--;
            }
          }
          inp.tap = false; inp.btn = null;
        } else {
          ball.vy += 0.16 * f; ball.vx += wind * f; ball.x += ball.vx * f; ball.y += ball.vy * f; ball.life += dt;
          if (ball.x < 4){ ball.x = 4; ball.vx *= -0.6; }
          if (ball.x > W - 4){ ball.x = W - 4; ball.vx *= -0.6; }
          if (ball.y < 2){ ball.y = 2; ball.vy *= -0.5; }
          if (!ball.scored && ball.vy > 0 && ball.y > bin.y && ball.y < bin.y + 6 && ball.x > bin.x + 3 && ball.x < bin.x + bin.w - 3){
            ball.scored = true; score++; SFX.play('coin'); msg = 'CESTA!'; msgT = 800;
          }
          if (!ball.scored && ball.vy > 0 && ball.y > bin.y - 2 && ball.y < bin.y + 3 && (Math.abs(ball.x - bin.x) < 3 || Math.abs(ball.x - bin.x - bin.w) < 3)){ ball.vy *= -0.4; ball.vx *= 0.6; }
          if (ball.y > H + 10 || ball.life > 4500 || (ball.scored && ball.y > bin.y + bin.h - 4)){
            ball = null; newRound();
            if (balls <= 0){ over = true; SFX.play(score > 0 ? 'win' : 'sad'); }
          }
        }
        UI.hud('CESTAS ' + score, 'BOLAS ' + balls);
        UI.hint(msgT > 0 ? msg : (!ball && !over ? 'DESLIZE PARA ARREMESSAR' : ''));
      },
      draw(ctx){
        rect(ctx, 0, 0, W, H, '#f1d7c2');
        for (let y = 6; y < FY; y += 10) for (let x = (Math.floor(y / 10) % 2) ? 5 : 0; x < W; x += 10) px(ctx, x + 2, y, '#e8c3ab');
        rect(ctx, 0, FY - 4, W, 4, '#d9b98a'); rect(ctx, 0, FY, W, H - FY, '#c8945c');
        /* ventilador e vento */
        box(ctx, 6, 8, 16, 16, PAL.g, PAL.k); oEllipse(ctx, 14, 16, 4, 4, PAL.G, PAL.k);
        const wl = Math.round(wind * 260), ax = 30, ay = 16;
        rect(ctx, wl < 0 ? ax + wl : ax, ay, Math.abs(wl) + 1, 2, PAL.b);
        if (wl > 0){ px(ctx, ax + wl + 1, ay - 1, PAL.b); px(ctx, ax + wl + 1, ay + 2, PAL.b); }
        if (wl < 0){ px(ctx, ax + wl - 1, ay - 1, PAL.b); px(ctx, ax + wl - 1, ay + 2, PAL.b); }
        /* lixeira */
        box(ctx, bin.x, bin.y, bin.w, bin.h, '#c9c3d6', PAL.k);
        rect(ctx, bin.x - 1, bin.y, bin.w + 2, 3, PAL.G); rect(ctx, bin.x - 1, bin.y, bin.w + 2, 1, PAL.k);
        for (let i = bin.x + 3; i < bin.x + bin.w - 2; i += 4) rect(ctx, i, bin.y + 5, 1, bin.h - 8, PAL.G);
        /* mira */
        if (from && inp.down){
          const dx = inp.x - from.x, dy = inp.y - from.y;
          for (let i = 1; i <= 5; i++) px(ctx, start.x + dx * 0.25 * i, start.y + dy * 0.25 * i, PAL.k);
        }
        drawRat(ctx, start.x, FY - 2, ratOpts(msgT > 0 ? 'happy' : over ? (score > 3 ? 'happy' : 'sad') : 'normal'));
        if (ball) drawSpr(ctx, 'papel', ball.x - 3, ball.y - 3);
        else if (!over) drawSpr(ctx, 'papel', start.x - 3, start.y - 3);
      },
      over:() => over,
      result(){ return {score, coins:Math.min(40, score * 4)}; }
    };
  }

  GAMES.register({id:'torre', name:'Torre de queijos', icon:'queijo', how:'A fatia vai e volta. Toque para soltar em cima da anterior. Se alinhar perfeito, a torre não encolhe.'}, Torre);
  GAMES.register({id:'danca', name:'Dança do rato', icon:'nota', how:'As notas descem em três faixas. Toque na faixa certa quando a nota chegar na linha. Erre 12 vezes e a música para.'}, Danca);
  GAMES.register({id:'bolhas', name:'Bolhas do banho', icon:'sabonete', how:'Toque nas bolhas para estourar antes que escapem. Douradas valem 5, as escuras tiram 3. Você tem 45 segundos.'}, Bolhas);
  GAMES.register({id:'canos', name:'Canos da banheira', icon:'cano', how:'Toque nos canos para girar e levar a água da caixa até a banheira antes que ela esvazie.'}, Canos);
  GAMES.register({id:'guincho', name:'Diz o guincho', icon:'brilho', how:'Ouça a sequência de guinchos e repita tocando nas cores. A cada rodada entra mais um.'}, Guincho);
  GAMES.register({id:'basquete', name:'Basquete de papel', icon:'lixeira', how:'Deslize o dedo para arremessar a bolinha de papel na lixeira. Cuidado com o vento do ventilador. 10 bolas.'}, Basquete);
})();

/* ===== Loop principal, layout, toque e ligacao das partes ===== */
(function(){
  const cv = document.getElementById('cv');
  const stage = document.getElementById('stage');
  const ctx = cv.getContext('2d');
  let last = performance.now(), lastWall = Date.now(), saveT = 0;

  /* ---- layout: o jogo ocupa a tela toda, em pixels de 2x (ou mais em telas grandes) ---- */
  function layout(){
    const vw = Math.max(200, window.innerWidth), vh = Math.max(300, window.innerHeight);
    let bw = vw, bh = vh;
    if (bw / bh > 0.72) bw = Math.floor(bh * 0.72);
    if (bw / bh < 0.42) bh = Math.floor(bw / 0.42);
    SCALE = Math.max(2, Math.floor(bw / 125));
    W = Math.floor(bw / SCALE); H = Math.floor(bh / SCALE);
    cv.width = W; cv.height = H;
    cv.style.width = (W * SCALE) + 'px'; cv.style.height = (H * SCALE) + 'px';
    stage.style.width = (W * SCALE) + 'px'; stage.style.height = (H * SCALE) + 'px';
    stage.style.setProperty('--sw', (W * SCALE) + 'px');
    ctx.imageSmoothingEnabled = false;
    SCENE.ratX = Math.min(SCENE.ratX, W - 20); SCENE.targetX = Math.min(SCENE.targetX, W - 20);
  }
  layout();
  let resizeT = 0;
  window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(layout, 120); });
  window.addEventListener('orientationchange', () => { clearTimeout(resizeT); resizeT = setTimeout(layout, 300); });

  const hooks = {
    skip(){ simulate(12 * HOUR); save(); },
    reset(){
      UI.intro(name => { startNew(name); SCENE.room = 0; SCENE.ratX = W / 2; SCENE.ratY = LAY.ratY; SCENE.targetX = W / 2; SCENE.targetY = LAY.ratY; UI.toast('Oi, ' + S.name + '!'); addHearts(3); });
    },
    loaded(){ simulate(Date.now() - S.last); save(); SCENE.room = S.room; }
  };

  function inRoom(idx, then){
    if (SCENE.room === idx){ then(); return; }
    goRoom(idx);
    setTimeout(then, 320);
  }
  function activate(i){
    if (!S.started) return;
    const id = ICONS[i].id;
    switch (id){
      case 'comer':
        inRoom(1, () => UI.foodMenu(k => {
          const r = feed(k);
          if (r.ok){ SFX.play('eat'); UI.close(); setAnim('eat', 1700, {food:k}); setTimeout(addCrumbs, 900); UI.toast(r.msg, 1500); }
          else { SFX.play('no'); UI.toast(r.msg); if (!S.sleeping) setAnim('no', 900); }
        }));
        break;
      case 'luz':
        inRoom(0, () => {
          const r = toggleLight();
          SFX.play(S.sleeping ? 'sleep' : 'wake');
          if (!S.sleeping){ SCENE.ratX = bedSpot().x; SCENE.ratY = LAY.walkTop; randomWalkTarget(); }
          UI.toast(r.msg);
        });
        break;
      case 'brincar':
        if (S.sleeping){ SFX.play('no'); UI.toast('Shh... ' + S.name + ' está dormindo.'); break; }
        if (S.sick){ SFX.play('no'); UI.toast(S.name + ' está doente. Dê remédio primeiro.'); setAnim('no', 900); break; }
        if (S.energy < 10){ SFX.play('no'); UI.toast(S.name + ' está cansado demais.'); setAnim('no', 900); break; }
        UI.playMenu(gid => {
          UI.close();
          GAMES.start(gid, played => { if (played){ setAnim('happy', 1600); addHearts(2); } });
        });
        break;
      case 'remedio': {
        const r = medicine();
        SFX.play(r.ok ? 'ok' : 'no'); UI.toast(r.msg);
        setAnim(r.ok ? 'med' : 'no', 1000);
        break;
      }
      case 'banho':
        inRoom(2, () => {
          const r = bath();
          SFX.play(r.ok ? 'happy' : 'no'); UI.toast(r.msg);
          if (r.ok){ setAnim('bath', 2200); SCENE.ratX = tubSpot().x; SCENE.ratY = LAY.walkTop; SCENE.targetX = tubSpot().x + 30; SCENE.targetY = LAY.walkTop + 10; }
        });
        break;
      case 'status': UI.status(); break;
      case 'loja': UI.shop('food'); break;
      case 'config': UI.settings(hooks); break;
    }
  }

  function processEvents(){
    if (UI.isOpen() || GAMES.active()) return;
    while (S.pending.length){
      const ev = S.pending.shift();
      if (ev.indexOf('evolve:') === 0){
        SFX.play('evolve'); setAnim('evolve', 2600); UI.evolved(ev.split(':')[1]); save(); return;
      } else if (ev === 'sick'){ SFX.play('sick'); UI.toast(S.name + ' ficou doente!'); }
      else if (ev === 'woke'){ SFX.play('wake'); UI.toast(S.name + ' acordou sozinho!'); SCENE.ratX = bedSpot().x; SCENE.ratY = LAY.walkTop; randomWalkTarget(); }
      else if (ev === 'autosleep'){ SFX.play('sleep'); UI.toast(S.name + ' caiu no sono de tanto cansaço.'); }
    }
  }

  function loop(now){
    const dt = Math.min(100, now - last); last = now;
    const wall = Date.now(), gap = wall - lastWall; lastWall = wall;
    if (S.started){
      if (gap > 1500) simulate(gap - dt);
      tick(dt);
    }
    if (GAMES.active()){
      GAMES.update(dt);
      GAMES.draw(ctx);
      UI.hideTop(); UI.hideNav();
    } else {
      updateScene(dt, now);
      drawScene(ctx, now);
      processEvents();
      if (S.started && UI.current() !== 'title'){
        UI.topbar(ROOMS[SCENE.room].name + (S.sleeping ? ' · zzz' : ''), S.coins);
        UI.nav(d => { SFX.play('blip'); goRoom(SCENE.room + d, d); });
      } else { UI.hideTop(); UI.hideNav(); }
    }
    saveT += dt;
    if (saveT > 10000){ saveT = 0; if (S.started) save(); }
    requestAnimationFrame(loop);
  }

  /* ---- toque na tela ---- */
  function canvasXY(e){
    const r = cv.getBoundingClientRect();
    return {x:(e.clientX - r.left) / r.width * W, y:(e.clientY - r.top) / r.height * H};
  }
  function roomTap(x, y){
    if (!S.started) return;
    if (y >= H - LAY.bar){
      const i = Math.min(ICONS.length - 1, Math.floor(x / (W / ICONS.length)));
      SCENE.sel = i; SFX.play('ok'); activate(i); return;
    }
    if (y < LAY.top) return;
    for (let i = 0; i < S.poops; i++){
      const p = poopSpot(i);
      if (p.room === SCENE.room && Math.abs(x - p.x) < 9 && Math.abs(y - (p.y - 4)) < 9){
        const r = cleanPoop(); if (r.ok){ SFX.play('ok'); UI.toast(r.msg, 1200); } return;
      }
    }
    const pos = ratPos(ROOMS[SCENE.room].id);
    if (!pos) return;
    if (Math.abs(x - pos.x) < 18 && y > ratTop(S.stage, pos.y) - 6 && y < pos.y + 6){
      if (S.sleeping){ UI.toast('Zzz...', 900); return; }
      const r = petRat();
      if (r.ok){ SFX.play('pet'); setAnim('pet', 900); addHearts(2); }
      else { UI.toast(r.msg, 900); }
    }
  }
  let pd = null;
  cv.addEventListener('pointerdown', e => {
    e.preventDefault(); SFX.ensure();
    const p = canvasXY(e);
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    pd = {x:p.x, y:p.y, t:performance.now()};
    if (GAMES.active()) GAMES.pointer('down', p.x, p.y);
    else if (UI.current() === 'title') UI.button('B');
  });
  cv.addEventListener('pointermove', e => { if (GAMES.active()){ const p = canvasXY(e); GAMES.pointer('move', p.x, p.y); } });
  function pointerEnd(e){
    const p = canvasXY(e);
    if (GAMES.active()){ GAMES.pointer('up', p.x, p.y); pd = null; return; }
    if (!pd) return;
    const dx = p.x - pd.x, dy = p.y - pd.y, dtm = performance.now() - pd.t;
    pd = null;
    if (UI.isOpen()) return;
    if (Math.abs(dx) > 28 && Math.abs(dx) > Math.abs(dy) * 1.5 && dtm < 600){
      SFX.play('blip'); goRoom(SCENE.room + (dx < 0 ? 1 : -1), dx < 0 ? 1 : -1); return;
    }
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) roomTap(p.x, p.y);
  }
  cv.addEventListener('pointerup', pointerEnd);
  cv.addEventListener('pointercancel', () => { pd = null; if (GAMES.active()) GAMES.pointer('up', 0, 0); });

  /* ---- teclado (PC) ---- */
  function press(k){
    SFX.ensure();
    if (GAMES.active()){ GAMES.button(k); return; }
    if (UI.isOpen()){ UI.button(k); return; }
    if (!S.started) return;
    if (k === 'A'){ SCENE.sel = (SCENE.sel + 1) % ICONS.length; SFX.play('blip'); }
    else if (k === 'B'){ if (SCENE.sel >= 0){ SFX.play('ok'); activate(SCENE.sel); } else { SCENE.sel = 0; SFX.play('blip'); } }
    else if (k === 'C'){ SCENE.sel = -1; SFX.play('back'); }
  }
  document.addEventListener('keydown', e => {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')){
      if (e.key === 'Enter' && e.target.tagName === 'INPUT'){ e.preventDefault(); UI.button('B'); }
      return;
    }
    if (!GAMES.active() && !UI.isOpen() && S.started && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')){
      e.preventDefault(); goRoom(SCENE.room + (e.key === 'ArrowRight' ? 1 : -1), e.key === 'ArrowRight' ? 1 : -1); return;
    }
    const map = {ArrowLeft:'A', a:'A', ArrowRight:'C', c:'C', Enter:'B', ' ':'B', ArrowUp:'B', b:'B', Escape:'C', Backspace:'C', ArrowDown:'A', Tab:'A'};
    const k = map[e.key];
    if (k){ e.preventDefault(); press(k); }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden){ if (S.started) save(); }
    else { if (S.started){ simulate(Date.now() - S.last); save(); } lastWall = Date.now(); last = performance.now(); }
  });
  window.addEventListener('pagehide', () => { if (S.started) save(); });

  /* ---- inicio ---- */
  const had = load();
  SFX.on = S.sound;
  if (had && S.started){ simulate(Date.now() - S.last); save(); }
  SCENE.room = S.room || 0;
  SCENE.ratX = W / 2; SCENE.targetX = W / 2; SCENE.ratY = LAY.ratY; SCENE.targetY = LAY.ratY;
  UI.title(() => {
    SFX.ensure(); SFX.play('ok');
    if (S.started){ UI.close(); }
    else { UI.intro(name => { startNew(name); UI.toast('Oi, ' + S.name + '!'); addHearts(3); }); }
  });
  requestAnimationFrame(loop);
})();

</script>
